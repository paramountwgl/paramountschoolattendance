<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Office QR Station | Paramount</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #004d26; color: white; }
        .qr-card { background: white; padding: 40px; border-radius: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); text-align: center; }
        #qrcode { margin-bottom: 20px; padding: 10px; }
        .timer-bar { width: 100%; height: 5px; background: #eee; border-radius: 10px; margin-top: 20px; overflow: hidden; }
        .progress { height: 100%; background: #ffd700; width: 100%; transition: width 1s linear; }
    </style>
</head>
<body>

    <h1 style="font-family: 'Montserrat'; text-transform: uppercase;">Staff Entry Point</h1>
    <div class="qr-card">
        <div id="qrcode"></div>
        <div style="color: #333; font-weight: 800; font-size: 14px;">SCAN WITH ANY CAMERA TO SIGN</div>
        <div class="timer-bar"><div class="progress" id="pBar"></div></div>
    </div>

    <script>
        const qrContainer = document.getElementById("qrcode");
        const qrcode = new QRCode(qrContainer, { width: 300, height: 300 });

        // CHANGE THIS to your actual live website URL
        const BASE_URL = "https://your-portal-link.com/mark-attendance.html";

        function updateQR() {
            const now = new Date();
            // Create a token that changes every 60 seconds
            const timeToken = btoa(now.toISOString().substring(0, 16)); 
            const finalURL = `${BASE_URL}?auth=${timeToken}`;
            
            qrcode.makeCode(finalURL);
            console.log("New Secure Link:", finalURL);
        }

        let timeLeft = 60;
        setInterval(() => {
            timeLeft--;
            document.getElementById('pBar').style.width = (timeLeft / 60 * 100) + "%";
            if(timeLeft <= 0) {
                updateQR();
                timeLeft = 60;
            }
        }, 1000);

        updateQR();
    </script>
</body>
</html>
