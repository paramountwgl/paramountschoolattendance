<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Student Accessory Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- PDF Generation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --primary: #002347; /* Paramount Navy */
            --accent: #C5A059;  /* Institutional Gold */
            --bg: #f8f9fa;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--primary); }

        .navbar { background: var(--primary); border-bottom: 3px solid var(--accent); }
        .navbar-brand { font-weight: 700; color: white !important; }

        .admin-card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); background: white; margin-bottom: 2rem; }
        .table thead { background-color: #f1f3f5; }
        .table thead th { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #6c757d; border: none; padding: 15px; }
        
        .badge-pending { background-color: #ffeeba; color: #856404; }
        .badge-confirmed { background-color: #d4edda; color: #155724; }
        
        .btn-action { border-radius: 8px; padding: 6px 12px; font-weight: 600; transition: 0.3s; }
        .status-select { font-size: 14px; border-radius: 8px; border: 1px solid #dee2e6; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand" href="#"><i class="bi bi-shield-lock-fill me-2"></i> ADMIN PORTAL</a>
        <div class="text-white small">Live Store Monitor</div>
    </div>
</nav>

<div class="container my-5">
    <div class="row mb-4">
        <div class="col">
            <h2 class="fw-bold">Order Management</h2>
            <p class="text-muted">Manage accessories orders and communicate with parents.</p>
        </div>
    </div>

    <div class="admin-card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Student Details</th>
                        <th>Purchase</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody id="order-table-body">
                    <!-- Orders will inject here live -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal: Bill Preview -->
<div class="modal fade" id="previewModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold">Order Summary Preview</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4" id="preview-content">
                <!-- Preview details inject here -->
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Close</button>
                <button type="button" id="confirm-whatsapp-btn" class="btn btn-success rounded-pill px-4">
                    <i class="bi bi-whatsapp me-2"></i>Send Bill via WhatsApp
                </button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDRYk9KOK-ga0c88dnYMsAoifW2NJTd_Y8",
        authDomain: "paramount-school-d55bc.firebaseapp.com",
        projectId: "paramount-school-d55bc",
        storageBucket: "paramount-school-d55bc.firebasestorage.app",
        messagingSenderId: "130979432562",
        appId: "1:130979432562:web:4cd94787b23f9daba51aeb"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- LIVE LISTENER ---
    const q = query(collection(db, "orders"), orderBy("created_at", "desc"));
    onSnapshot(q, (snapshot) => {
        const tableBody = document.getElementById('order-table-body');
        let html = '';
        
        snapshot.forEach((docSnap) => {
            const order = docSnap.data();
            const docId = docSnap.id;
            const itemsSummary = order.items.map(i => `${i.name} (x${i.quantity})`).join(', ');

            html += `
                <tr>
                    <td><span class="fw-bold text-primary">${order.order_id}</span></td>
                    <td>
                        <div class="fw-bold">${order.customer_name}</div>
                        <small class="text-muted">${order.customer_phone}</small>
                    </td>
                    <td><small class="text-truncate d-inline-block" style="max-width: 200px;">${itemsSummary}</small></td>
                    <td><span class="fw-bold">₹${order.grand_total}</span></td>
                    <td>
                        <select class="form-select status-select shadow-sm" onchange="updateStatus('${docId}', this.value)">
                            <option value="Pending" ${order.order_status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="Confirmed" ${order.order_status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                            <option value="Cancelled" ${order.order_status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                        </select>
                    </td>
                    <td class="text-end">
                        <div class="d-flex justify-content-end gap-2">
                            <button class="btn btn-outline-primary btn-sm btn-action" onclick='previewBill(${JSON.stringify(order)})'>
                                <i class="bi bi-eye-fill"></i>
                            </button>
                            <button class="btn btn-outline-danger btn-sm btn-action" onclick="deleteOrder('${docId}')">
                                <i class="bi bi-trash-fill"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        });
        tableBody.innerHTML = html || '<tr><td colspan="6" class="text-center py-5">No orders found.</td></tr>';
    });

    // --- ADMIN TOOLS ---
    window.updateStatus = async (id, status) => {
        await updateDoc(doc(db, "orders", id), { order_status: status });
        alert("Status updated successfully.");
    };

    window.deleteOrder = async (id) => {
        if(confirm("Are you sure you want to delete this order? This cannot be undone.")) {
            await deleteDoc(doc(db, "orders", id));
        }
    };

    window.previewBill = (order) => {
        const previewContent = document.getElementById('preview-content');
        let itemsHtml = order.items.map(i => `<li>${i.name} - ₹${i.price} x ${i.quantity}</li>`).join('');
        
        previewContent.innerHTML = `
            <h6 class="fw-bold mb-3">Order Details</h6>
            <p class="mb-1"><strong>Student:</strong> ${order.customer_name}</p>
            <p class="mb-1"><strong>Email:</strong> ${order.customer_email}</p>
            <p class="mb-3"><strong>Order ID:</strong> ${order.order_id}</p>
            <hr>
            <ul class="small mb-3">${itemsHtml}</ul>
            <div class="bg-light p-2 rounded fw-bold text-end">Total: ₹${order.grand_total}</div>
        `;
        
        const btn = document.getElementById('confirm-whatsapp-btn');
        btn.onclick = () => generateAndSend(order);
        
        new bootstrap.Modal('#previewModal').show();
    };

 async function generateAndSend(order) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    // --- PREMIUM BRANDING COLORS ---
    const navy = [0, 35, 71]; 
    const gold = [197, 160, 89]; 

    // --- HEADER SECTION ---
    doc.setFillColor(...navy);
    doc.rect(0, 0, 210, 40, 'F'); 
    
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(22);
    doc.setFont("helvetica", "bold");
    doc.text("PARAMOUNT ACCESSORIES STORE", 14, 25);
    
    // --- CUSTOMER DETAILS SECTION ---
    doc.setTextColor(...navy);
    doc.setFontSize(12);
    doc.text("CUSTOMER DETAILS", 14, 50);
    
    doc.setDrawColor(...gold);
    doc.setLineWidth(0.5);
    doc.line(14, 52, 60, 52); 

    doc.setFontSize(10);
    doc.setFont("helvetica", "normal");
    doc.setTextColor(50, 50, 50);
    
    doc.text(`Order ID: ${order.order_id}`, 14, 60);
    doc.text(`Student: ${order.customer_name}`, 14, 66);
    doc.text(`Email: ${order.customer_email}`, 14, 72);
    doc.text(`Phone: ${order.customer_phone}`, 120, 60);

    // --- CLEANED TIMESTAMP LOGIC ---
    let orderDate = new Date(); 
    if (order.created_at) {
        orderDate = typeof order.created_at.toDate === 'function' 
                    ? order.created_at.toDate() 
                    : new Date(order.created_at);
    }
    
    // Use the orderDate variable here
    doc.text(`Date: ${orderDate.toLocaleDateString('en-IN')}`, 120, 66);
    doc.text(`Time: ${orderDate.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}`, 120, 72);

    // --- PREMIUM TABLE LAYOUT ---
    const tableData = order.items.map(i => [
        i.name, 
        `₹${i.price}`, 
        i.quantity, 
        `₹${i.price * i.quantity}`
    ]);

    doc.autoTable({
        startY: 80,
        head: [['Product Description', 'Unit Price', 'Qty', 'Subtotal']],
        body: tableData,
        theme: 'striped',
        headStyles: { 
            fillColor: navy, 
            textColor: [255, 255, 255], 
            fontStyle: 'bold',
            halign: 'center'
        },
        columnStyles: {
            1: { halign: 'center' },
            2: { halign: 'center' },
            3: { halign: 'right' }
        },
        foot: [[
            { content: 'Grand Total Amount', colSpan: 3, styles: { halign: 'right', fontStyle: 'bold' } },
            { content: `₹${order.grand_total}`, styles: { halign: 'right', fontStyle: 'bold', fillColor: gold, textColor: navy } }
        ]],
        styles: { fontSize: 9, cellPadding: 4 }
    });

    const finalY = doc.lastAutoTable.finalY + 20;
    doc.setFontSize(8);
    doc.setTextColor(150, 150, 150);
    doc.text("This is a computer-generated bill for the Paramount Group of Institutions.", 14, finalY);

    const fileName = `${order.customer_name.replace(/\s+/g, '_')}_${order.order_id}.pdf`;
    doc.save(fileName);

    const msg = encodeURIComponent(
        `*OFFICIAL INVOICE* 📄\n\n` +
        `Dear Parent, the order for *${order.customer_name}* has been confirmed.\n\n` +
        `*Order ID:* ${order.order_id}\n` +
        `*Total Amount:* ₹${order.grand_total}\n\n` +
        `Your purchase bill has been downloaded. Please attach it here for your records.\n\n` +
        `— Paramount Group of Institutions`
    );
    window.open(`https://wa.me/${order.customer_phone}?text=${msg}`, '_blank');
}
    // Attach to window for HTML onclicks
    window.previewBill = previewBill;
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
