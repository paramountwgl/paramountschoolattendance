<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syllabus Portal | Paramount School</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Segoe+UI:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        :root { --forest: #004d26; --gold: #ffd700; --light: #f4f7f6; --danger: #d32f2f; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f1; margin: 0; min-height: 100vh; }

        /* --- FIXED HEADER STYLES --- */
        header { background: var(--forest); color: white; padding: 12px 3%; box-shadow: 0 4px 15px rgba(0,0,0,0.15); width: 100%; box-sizing: border-box; }
        .header-content { display: flex; align-items: center; justify-content: center; gap: 15px; max-width: 1400px; margin: 0 auto; }
        .header-logo { height: 60px; width: auto; flex-shrink: 0; display: block; }
        .school-text { display: flex; flex-direction: column; line-height: 1.1; text-align: left; }
        .school-name-main { font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 1px; margin: 0; }
        .school-name-sub { font-family: 'Montserrat', sans-serif; font-size: 10px; color: var(--gold); font-weight: 700; text-transform: uppercase; margin: 0; }
        
        .portal-divider { text-align: center; margin: 25px auto; max-width: 1000px; position: relative; height: 20px; }
        .portal-divider hr { border: none; border-top: 2px solid #ccc; margin-top: 10px; }
        .portal-divider span { position: absolute; top: 0; left: 50%; transform: translateX(-50%); background: #f0f2f1; padding: 0 20px; color: var(--forest); font-family: 'Montserrat'; font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; }

        /* --- AUTH CARD STYLES (EXACT MATCH TO SCREENSHOT) --- */
        #securityOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f0f2f1; display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .auth-card { 
            background: white; width: 90%; max-width: 420px; padding: 45px 35px; 
            border-radius: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); 
            text-align: center; border-bottom: 8px solid var(--forest);
        }
        .auth-card img { height: 80px; width: auto; margin-bottom: 20px; }
        .auth-card h1 { font-family: 'Montserrat'; font-weight: 800; font-size: 24px; color: #000; margin: 0 0 8px; letter-spacing: 1px; }
        .auth-card .sub-tag { font-family: 'Montserrat'; font-weight: 700; font-size: 11px; color: var(--gold); letter-spacing: 1.5px; margin-bottom: 30px; text-transform: uppercase; }

        .auth-input { 
            width: 100%; padding: 14px 18px; margin-bottom: 15px; border-radius: 12px; 
            border: 1px solid #e0e0e0; background: #fafafa; font-size: 15px; outline: none; 
            box-sizing: border-box; color: #333;
        }

        .btn-unlock { 
            width: 100%; background: var(--forest); color: white; padding: 16px; 
            border-radius: 50px; border: none; font-family: 'Montserrat'; font-weight: 800; 
            font-size: 15px; cursor: pointer; text-transform: uppercase; margin-top: 15px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.3s;
        }
        .btn-unlock:hover { background: #00361a; }

        .btn-return { 
            width: 100%; background: #f1f4f7; color: #445a64; padding: 14px; 
            border-radius: 50px; border: none; font-family: 'Montserrat'; font-weight: 700; 
            font-size: 12px; cursor: pointer; text-transform: uppercase; margin-top: 12px; 
            text-decoration: none; display: block; box-sizing: border-box;
        }

        .forgot-link { color: #888; font-size: 11px; text-decoration: underline; margin-top: 25px; display: block; font-weight: 600; cursor: pointer; }

        /* --- MAIN EDITOR CONTENT --- */
        #mainContent { display: none; width: 100%; padding: 0 20px 40px; box-sizing: border-box; }
        .admin-container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); border-top: 8px solid var(--forest); }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .audit-info-bar { background: #fffdf0; padding: 10px 20px; border-radius: 10px; border-left: 5px solid var(--gold); margin-bottom: 20px; font-size: 12px; color: #555; display: flex; justify-content: space-between; align-items: center; }
        .selection-bar { display: flex; gap: 20px; background: #f0f4f2; padding: 20px; border-radius: 12px; margin-bottom: 25px; align-items: flex-end; }
        .input-box { flex: 1; }
        .input-box label { display: block; font-weight: 700; font-size: 11px; color: #444; margin-bottom: 8px; text-transform: uppercase; text-align: left;}
        select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-weight: 600; outline: none; background: white; }
        .syllabus-table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        .syllabus-table th { background: var(--forest); color: white; padding: 15px; text-align: left; font-size: 13px; text-transform: uppercase; }
        .syllabus-table td { padding: 12px; border: 1px solid #eee; vertical-align: top; }
        .subject-col { width: 25%; background: #fdfdfd; font-weight: 800; color: #333; font-size: 14px; border-right: 3px solid var(--gold) !important; }
        textarea { width: 100%; height: 75px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; resize: none; font-family: inherit; font-size: 14px; box-sizing: border-box;}
        .action-area { display: flex; gap: 15px; margin-top: 30px; }
        .btn-publish { background: var(--forest); color: white; border: none; padding: 18px; flex: 2; border-radius: 50px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-wipe { background: #333; color: white; border: 2px solid var(--danger); padding: 18px; flex: 1; border-radius: 50px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .status-tag { font-size: 10px; color: #777; margin-top: 4px; display: block; font-weight: bold; }
    </style>
</head>
<body>

<div id="securityOverlay">
    <div class="auth-card">
        <img src="logo.png">
        <h1>PARAMOUNT SCHOOL</h1>
        <div class="sub-tag">SYLLABUS ENTRY ACCESS</div>

        <select id="staffUser" class="auth-input">
            <option value="">-- Select Staff --</option>
            <option value="Mr. Shaik Ahmad">Mr. Shaik Ahmad</option>
            <option value="Ms. Riha">Ms. Riha</option>
            <option value="Ms. Raniya Zainab">Ms. Raniya Zainab</option>
            <option value="Ms. Roqiya Begum">Ms. Roqiya Begum</option>
            <option value="Ms. G.Rajitha">Ms. G.Rajitha</option>
            <option value="Ms. Ameena Tabassum">Ms. Ameena Tabassum</option>
            <option value="Ms. Shaik Shabana">Ms. Shaik Shabana</option>
            <option value="Ms. B.Ravali">Ms. B.Ravali</option>
            <option value="Ms. L.Kalyani">Ms. L.Kalyani</option>
            <option value="Ms. J.Alaya Sree">Ms. J.Alaya Sree</option>
            <option value="Ms. S.Sujatha">Ms. S.Sujatha</option>
            <option value="Ms. J.Prathibha">Ms. J.Prathibha</option>
            <option value="Ms. P.Shailaja">Ms. P.Shailaja</option>
            <option value="Ms. A.Jhansi Rani">Ms. A.Jhansi Rani</option>
            <option value="Ms. S. Neelima">Ms. S. Neelima</option>
        </select>

        <input type="password" id="staffPass" class="auth-input" placeholder="Password">

        <button class="btn-unlock" onclick="authenticateStaff()">
            UNLOCK PORTAL <i class="fas fa-lock"></i>
        </button>

        <a href="index.html" class="btn-return">RETURN TO DASHBOARD</a>

        <div class="forgot-link">Forgot Password?</div>
    </div>
</div>

<div id="mainContent">
    <header>
        <div class="header-content">
            <img src="logo.png" class="header-logo" alt="Logo">
            <div class="school-text">
                <span class="school-name-main">PARAMOUNT</span>
                <span class="school-name-sub">ENGLISH MEDIUM SCHOOL</span>
            </div>
        </div>
    </header>

    <div class="portal-divider">
        <hr>
        <span>SYLLABUS PORTAL</span>
    </div>

    <div class="admin-container">
        <div class="header-flex">
            <h2 style="color:var(--forest); font-family: Montserrat; margin:0;"><i class="fas fa-book-open"></i> Exam Content Editor</h2>
            <a href="index.html" style="text-decoration:none; color:var(--forest); font-weight:700;"><i class="fas fa-arrow-left"></i> Portal Home</a>
        </div>

        <div class="audit-info-bar" id="auditBar" style="display:none;">
            <span><i class="fas fa-user-edit"></i> Last Updated By: <b id="lastFaculty">---</b></span>
            <span><i class="fas fa-clock"></i> Time: <b id="lastTime">---</b></span>
        </div>

        <div class="selection-bar">
            <div class="input-box">
                <label>1. Select Class</label>
                <select id="sylClass" onchange="renderTableAndLoadData()">
                    <option value="Pre-KG">Pre-KG</option><option value="KG-1">KG-1</option>
                    <option value="KG-2">KG-2</option><option value="Grade-1">Grade-1</option>
                    <option value="Grade-2">Grade-2</option><option value="Grade-3">Grade-3</option>
                    <option value="Grade-4">Grade-4</option><option value="Grade-5">Grade-5</option>
                    <option value="Grade-6">Grade-6</option><option value="Grade-7">Grade-7</option>
                    <option value="Grade-8">Grade-8</option>
                </select>
            </div>
            <div class="input-box">
                <label>2. Select Examination</label>
                <select id="sylExam" onchange="renderTableAndLoadData()">
                    <option value="Unit Test-1">Unit Test-1</option><option value="Unit Test-2">Unit Test-2</option>
                    <option value="Quarterly">Quarterly</option><option value="Half-Yearly">Half-Yearly</option>
                    <option value="Annual">Annual</option>
                </select>
            </div>
        </div>

        <table class="syllabus-table">
            <thead><tr><th>Subject Name</th><th>Syllabus Content</th></tr></thead>
            <tbody id="syllabusRows"></tbody>
        </table>

        <div class="action-area">
            <button class="btn-publish" onclick="saveSyllabusBulk()"><i class="fas fa-cloud-upload-alt"></i> PUBLISH SYLLABUS</button>
            <button class="btn-wipe" onclick="wipeClassData()"><i class="fas fa-trash-alt"></i> WIPE PREMIUM</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDRYk9KOK-ga0c88dnYMsAoifW2NJTd_Y8", databaseURL: "https://paramount-school-d55bc-default-rtdb.firebaseio.com", projectId: "paramount-school-d55bc" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    let activeFaculty = "";
    const registry = {
        "Mr. Shaik Ahmad": "Ahmad@123", "Ms. Roqiya Begum": "Roqiya@123", "Ms. G.Rajitha": "Rajitha@123",
        "Ms. Ameena Tabassum": "Ameena@123", "Ms. Shaik Shabana": "Shabana@123", "Ms. B.Ravali": "Ravali@123",
        "Ms. L.Kalyani": "Kalyani@123", "Ms. J.Alaya Sree": "Alaya@123", "Ms. S.Sujatha": "Sujatha@123",
        "Ms. J.Prathibha": "Prathibha@123", "Ms. P.Shailaja": "Phailaja@123", "Ms. A.Jhansi Rani": "Jhansi@123", 
        "Ms. S. Neelima": "Neelima@123", "Ms. Riha": "Riha@123", "Ms. Raniya Zainab": "Raniya@123"
    };

    function authenticateStaff() {
        const user = document.getElementById('staffUser').value;
        const pass = document.getElementById('staffPass').value;
        if(registry[user] === pass) {
            activeFaculty = user;
            document.getElementById('securityOverlay').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            renderTableAndLoadData();
        } else {
            Swal.fire('Access Denied', 'Incorrect password.', 'error');
        }
    }

    const primaryGroup = ["Telugu", "Hindi", "English", "Mathematics", "EVS/Science", "Social Studies", "Computer", "GK"];
    const middleGroup = ["Telugu", "Hindi", "English", "Mathematics", "Physics", "Biology", "Social Studies", "Computer"];
    const classSubjectGroups = { "Pre-KG": ["Rhymes", "English Oral", "English Written", "Maths Oral", "Maths Written", "Conversation", "Drawing"], "KG-1": ["Telugu", "Hindi", "English", "Mathematics", "EVS", "Rhymes"], "KG-2": ["Telugu", "Hindi", "English", "Mathematics", "EVS", "GK"], "Grade-1": primaryGroup, "Grade-2": primaryGroup, "Grade-3": primaryGroup, "Grade-4": primaryGroup, "Grade-5": primaryGroup, "Grade-6": middleGroup, "Grade-7": middleGroup, "Grade-8": middleGroup };

    function getSafeId(name) { return "syl_" + name.replace(/[^a-zA-Z0-9]/g, '_'); }

    function getFormattedTimestamp() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        const date = now.toLocaleDateString('en-GB'); 
        return `${date} | ${hours}:${minutes} ${ampm}`;
    }

    async function renderTableAndLoadData() {
        const cls = document.getElementById('sylClass').value;
        const exam = document.getElementById('sylExam').value;
        const tbody = document.getElementById('syllabusRows');
        let subjects = classSubjectGroups[cls] || primaryGroup;
        
        tbody.innerHTML = "";
        subjects.forEach(subject => {
            const safeId = getSafeId(subject);
            tbody.innerHTML += `<tr><td class="subject-col">${subject}</td><td><textarea id="${safeId}"></textarea><span class="status-tag" id="status_${safeId}"></span></td></tr>`;
        });

        const snap = await db.ref(`class_syllabus/${cls}/${exam}`).once('value');
        const data = snap.val() || {};
        
        if(data.lastUpdatedBy) {
            document.getElementById('auditBar').style.display = 'flex';
            document.getElementById('lastFaculty').innerText = data.lastUpdatedBy;
            document.getElementById('lastTime').innerText = data.lastUpdatedTime;
        } else {
            document.getElementById('auditBar').style.display = 'none';
        }

        subjects.forEach(subject => {
            const safeId = getSafeId(subject);
            const content = data[subject] || "";
            document.getElementById(safeId).value = content;
            const tag = document.getElementById(`status_${safeId}`);
            tag.innerHTML = content ? `<i class="fas fa-check-circle"></i> Live` : `Empty`;
            tag.style.color = content ? "#006633" : "#888";
        });
    }

    async function saveSyllabusBulk() {
        const cls = document.getElementById('sylClass').value;
        const exam = document.getElementById('sylExam').value;
        Swal.fire({ title: 'Publishing...', didOpen: () => Swal.showLoading() });

        const payload = { 
            lastUpdatedTime: getFormattedTimestamp(),
            lastUpdatedBy: activeFaculty 
        };
        let subjects = classSubjectGroups[cls] || primaryGroup;
        subjects.forEach(subject => payload[subject] = document.getElementById(getSafeId(subject)).value.trim());

        await db.ref(`class_syllabus/${cls}/${exam}`).update(payload);
        Swal.fire({ icon: 'success', title: 'Success!', text: 'Syllabus Updated.', timer: 1500, showConfirmButton: false });
        renderTableAndLoadData();
    }

    async function wipeClassData() {
        const cls = document.getElementById('sylClass').value;
        const exam = document.getElementById('sylExam').value;
        const { value: confirm } = await Swal.fire({
            title: 'Wipe Data?', html: 'Type <b style="color:red">DELETE</b> to confirm:',
            input: 'text', icon: 'warning', showCancelButton: true,
            inputValidator: (v) => v.toUpperCase() !== 'DELETE' && 'Type DELETE!'
        });
        if (confirm) {
            await db.ref(`class_syllabus/${cls}/${exam}`).remove();
            Swal.fire('Deleted!', 'Data Wiped.', 'success');
            renderTableAndLoadData();
        }
    }
</script>
</body>
</html>
