<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paramount E/M HIGH SCHOOL | Executive Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --p-green: #004d26; 
            --p-gold: #ffd700; 
            --p-blue: #003366;
            --white: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; 
            background: #f4f7f6;
            min-height: 100vh;
        }

        /* RESPONSIVE HEADER */
        header { 
            background: linear-gradient(135deg, var(--p-green), #002b12);
            padding: 15px 5%; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 4px solid var(--p-gold);
            position: sticky; top: 0; z-index: 1000;
        }
        .logo-img { height: clamp(40px, 12vw, 60px); }
        .header-title h1 { font-family: 'Cinzel', serif; color: white; margin: 0; font-size: clamp(0.9rem, 4vw, 1.4rem); letter-spacing: 1px; }
        .header-title p { color: var(--p-gold); margin: 0; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; }

        /* FLUID HUB GRID */
        .hub-grid {
            display: grid;
            /* Desktop: 4 columns | Tablet: 3 columns | Mobile: 2 columns */
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            max-width: 1100px;
            margin: 20px auto;
            padding: 15px;
        }

        /* PREMIUM BUTTON CARDS */
        .hub-card {
            background: var(--white);
            border-radius: 20px;
            padding: 25px 10px;
            text-align: center;
            text-decoration: none;
            border: 1px solid #eee;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .hub-card:active { transform: scale(0.95); background: #f0f0f0; }

        .hub-card i {
            font-size: 2.2rem;
            color: var(--p-green);
            filter: drop-shadow(0 4px 8px rgba(0, 77, 38, 0.1));
        }

        .hub-card span {
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--p-green);
            line-height: 1.2;
        }

        .hub-card small {
            font-size: 0.55rem;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* HOME BUTTON HIGHLIGHT */
        .home-card {
            background: var(--p-blue);
            border-color: var(--p-gold);
            grid-column: span 1; /* Keeps it in the grid flow */
        }
        .home-card i, .home-card span { color: var(--p-gold) !important; }

        /* MOBILE SPECIFIC OVERRIDES */
        @media (max-width: 480px) {
            .hub-grid {
                grid-template-columns: 1fr 1fr; /* Forces exactly 2 columns */
                gap: 12px;
                padding: 12px;
            }
            .hub-card { padding: 20px 5px; }
            .hub-card i { font-size: 1.8rem; }
            .hub-card span { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

<header>

        <div class="header-title">

        </div>
    </div>
</header>

</html>
