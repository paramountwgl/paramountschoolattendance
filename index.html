<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paramount School | Teacher Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Segoe+UI:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        :root { --forest: #006633; --gold: #ffd700; --danger: #e53935; --light: #f4f7f6; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); margin: 0; padding-bottom: 50px; overflow-x: hidden; }
        
        header { background: var(--forest); color: white; padding: 15px 3%; box-shadow: 0 4px 15px rgba(0,0,0,0.15); position: sticky; top: 0; z-index: 1000; }
        .header-content { display: flex; align-items: center; justify-content: center; gap: 15px; max-width: 1400px; margin: 0 auto; width: 100%; }
        .header-logo { height: clamp(45px, 10vw, 75px); width: auto; flex-shrink: 0; }
        .school-text { display: flex; flex-direction: column; line-height: 1.1; text-align: left; }
        .school-name-main { font-family: 'Montserrat', sans-serif; font-size: clamp(1.1rem, 5vw, 2rem); font-weight: 800; letter-spacing: 1px; }
        .school-name-sub { font-family: 'Montserrat', sans-serif; font-size: clamp(0.6rem, 2.5vw, 0.9rem); color: var(--gold); font-weight: 700; text-transform: uppercase; }

        /* THE HUB TITLE */
        .hub-title { text-align: center; margin: 30px 0 10px; color: var(--forest); font-family: 'Montserrat', sans-serif; }

        .portal-nav-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px auto; padding: 0 15px; max-width: 950px; }
        .btn-premium-nav { padding: 20px 10px; border-radius: 18px; text-decoration: none; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1); background: linear-gradient(135deg, #004d26 0%, var(--forest) 100%); color: white; border: 2px solid var(--gold); transition: 0.3s; text-align: center; }
        .btn-premium-nav:hover { transform: translateY(-5px); border-color: white; box-shadow: 0 12px 25px rgba(0, 102, 51, 0.2); }
        .btn-premium-nav i { font-size: 1.8rem; }

        @media (max-width: 480px) {
            .portal-nav-container { grid-template-columns: repeat(2, 1fr); }
            .btn-premium-nav { font-size: 10px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-content">
        <img src="logo.png" class="header-logo">
        <div class="school-text">
            <span class="school-name-main">PARAMOUNT</span>
            <span class="school-name-sub">ENGLISH MEDIUM SCHOOL</span>
        </div>
    </div>
</header>

<div class="hub-title">
    <h2 style="font-weight: 800; text-transform: uppercase; letter-spacing: 2px;">Faculty Hub</h2>
    <p style="font-size: 12px; color: #666; font-weight: 600;">Welcome, Academic Staff</p>
</div>

<div class="portal-nav-container">
    <a href="attendance.html" class="btn-premium-nav"><i class="fas fa-clipboard-check"></i> Attendance Registry</a>
    <a href="homework-admin.html" class="btn-premium-nav"><i class="fas fa-book-reader"></i> Homework Publisher</a>
    <a href="admin.html" class="btn-premium-nav"><i class="fas fa-user-shield"></i> Admin Control</a>
    <a href="marks.html" class="btn-premium-nav"><i class="fas fa-chart-line"></i> Marks Entry</a>
    <a href="syllabus-admin.html" class="btn-premium-nav"><i class="fas fa-book-open"></i> Syllabus</a>
    <a href="fees.html" class="btn-premium-nav"><i class="fas fa-file-invoice-dollar"></i> Fees Dept</a>
    <a href="id_card_generator.html" class="btn-premium-nav"><i class="fas fa-id-card"></i> ID Generator</a>
    <a href="Timetable.html" class="btn-premium-nav"><i class="fas fa-calendar-alt"></i> Time Table</a>
    <a href="Parents Checkbox.html" class="btn-premium-nav"><i class="fas fa-tasks-alt"></i> Parents HM checker</a>
    <a href="halltickets.html" class="btn-premium-nav"><i class="fas fa-ticket-alt"></i> Halltickets </a>
    
    <a href="index.html" class="btn-premium-nav" style="background: var(--p-blue);"><i class="fas fa-home"></i> Home Portal</a>
</div>

</body>
</html>
