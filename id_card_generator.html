<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Paramount ID Generator</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        /* Screen Layout */
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #eef1f4; display: flex; padding: 20px; gap: 40px; justify-content: center; }
        
        .setup-panel { width: 350px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); height: fit-content; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #444; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        
        button { width: 100%; padding: 12px; background: #004d40; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        button:hover { background: #00332d; }
        .print-btn { background: #1a237e; }
        .print-btn:hover { background: #0d145a; }

        /* --- ID Card Design --- */
        .card-container {
            width: 325px;
            height: 500px;
            background: white;
            border: 1px solid #bbb;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        /* Header Alignment */
        .header { 
            display: flex; 
            align-items: center; 
            padding: 15px; 
            border-bottom: 1.5px solid #eee; 
            height: 90px;
            box-sizing: border-box;
        }
        .school-logo { width: 55px; height: 55px; object-fit: contain; margin-right: 12px; }
        .school-info { text-align: left; }
        .school-name { color: #004d40; font-size: 19px; font-weight: 900; margin: 0; line-height: 1; }
        .school-desc { color: #d32f2f; font-size: 10.5px; font-weight: bold; margin: 3px 0; letter-spacing: 0.5px; }
        .address { font-size: 7.5px; color: #555; line-height: 1.2; margin: 0; }

        /* Vertical Academic Year */
        .ay-text {
            position: absolute;
            transform: rotate(-90deg);
            left: -15px;
            top: 180px;
            color: #1976d2;
            font-weight: bold;
            font-size: 13px;
            width: 100px;
        }

       /* Photo Area */
        .photo-box {
            width: 140px;
            height: 165px;
            border: 2px solid #333;
            /* Changed margin-left from 105px to 80px to move it closer to the AY text */
            margin: 25px auto 15px 80px; 
            overflow: hidden;
            background: #f9f9f9;
        }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }

        /* Details Area */
        .details { padding: 0 25px; text-align: center; }
        .display-name { font-size: 20px; font-weight: bold; margin-bottom: 12px; color: #000; text-transform: uppercase; }
        .info-row { display: flex; margin-bottom: 5px; font-size: 13px; text-align: left; }
        .label-cell { width: 100px; font-weight: bold; color: #555; }
        .value-cell { color: #000; flex: 1; }

        /* Bottom Footer */
        .footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 75px; /* Increased height to fit signature */
            background: #1a237e;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            box-sizing: border-box;
        }
        .sig-area { 
            text-align: center; 
            font-size: 10px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Signature Image Style */
        .sig-img {
            height: 30px; /* Adjust this height to fit the signature perfectly */
            width: auto;
            margin-bottom: 2px;
            /* This filter makes a black signature appear white on the blue background */
            filter: brightness(0) invert(1); 
        }

        .sig-text { 
            border-top: 1px solid rgba(255,255,255,0.4); 
            padding-top: 2px; 
            font-weight: bold; 
        }
        .footer-loc { font-size: 10px; width: 60%; line-height: 1.3; }
        .sig-area { text-align: center; font-size: 10px; border-top: 1px solid rgba(255,255,255,0.4); padding-top: 3px; }
        .bottom-strip { height: 8px; background: #80deea; position: absolute; bottom: 0; width: 100%; }

        /* Print Logic */
        @media print {
            .setup-panel { display: none; }
            body { background: white; padding: 0; display: block; }
            .card-container { box-shadow: none; border: 1px solid #000; margin: auto; }
        }
    </style>
</head>
<body>

<div class="setup-panel">
    <h3>ID Configuration</h3>
    <div class="form-group">
        <label>Category:</label>
        <select id="mode" onchange="updateForm()">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
        </select>
    </div>

    <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="inName" placeholder="Enter Full Name">
    </div>

    <div id="studentInput">
        <div class="form-group">
            <label> Student Roll Number</label>
            <input type="text" id="inRoll" placeholder="e.g. 1298359">
        </div>
        <div class="form-group">
            <label>Class & Section</label>
            <input type="text" id="inClass" placeholder="e.g. 8th - B">
        </div>
        <div class="form-group">
            <label>Parent Mobile</label>
            <input type="text" id="inParent" placeholder="Mobile Number">
        </div>
    </div>

    <div id="teacherInput" style="display:none;">
        <div class="form-group">
            <label>Employee ID </label>
            <input type="text" id="inEmpID" placeholder="e.g. PESEMP0003">
        </div>
        <div class="form-group">
            <label>Designation</label>
            <input type="text" id="inDesignation" placeholder="e.g. Teacher">
        </div>
        <div class="form-group">
            <label>Mobile Number</label>
            <input type="text" id="inTeacherMob" placeholder="Mobile Number">
        </div>
    </div>

    <button onclick="updateCard()">Update Preview</button>
    <button class="print-btn" onclick="window.print()">Print ID Card</button>
</div>

<div class="card-container" id="printableCard">
    <div class="header">
        <img src="logo.png" alt="Logo" class="school-logo">
        <div class="school-info">
            <p class="school-name">PARAMOUNT</p>
            <p class="school-desc">ENGLISH MEDIUM HIGH SCHOOL</p>
            <p class="address">33-4-169, PENSIONPUR, THIMMAPUR (H), KHILA WARANGAL,<br>WARANGAL-506005</p>
        </div>
    </div>

    <div class="ay-text">AY:2026-27</div>

    <div class="photo-box">
        <img id="displayPhoto" src="placeholder.png" alt="ID Photo">
    </div>

    <div class="details">
        <div class="display-name" id="displayName">NAME PREVIEW</div>
        <div id="dynamicRows">
            </div>
    </div>

   <div class="footer">
        <div class="footer-loc">Pensionpur, Thimmapur (H), Wgl.</div>
        <div class="sig-area">
            <img src="Ahmad Correspondent Sign.png" alt="Signature" class="sig-img">
            <div class="sig-text">Correspondent</div>
        </div>
    </div>
    <div class="bottom-strip"></div>
</div>

<script>
    function updateForm() {
        const mode = document.getElementById('mode').value;
        document.getElementById('studentInput').style.display = mode === 'student' ? 'block' : 'none';
        document.getElementById('teacherInput').style.display = mode === 'teacher' ? 'block' : 'none';
    }

    function updateCard() {
        const mode = document.getElementById('mode').value;
        const name = document.getElementById('inName').value;
        const rows = document.getElementById('dynamicRows');
        const photo = document.getElementById('displayPhoto');

        document.getElementById('displayName').innerText = name || "NAME HERE";
        rows.innerHTML = "";

        if (mode === "student") {
            const roll = document.getElementById('inRoll').value;
            const cls = document.getElementById('inClass').value;
            const parent = document.getElementById('inParent').value;

            // Fetch from "student images" folder
            photo.src = roll ? "Student images/" + roll + ".png" : "placeholder.png";

            rows.innerHTML = `
                <div class="info-row"><span class="label-cell">Roll Number</span><span class="value-cell">: ${roll}</span></div>
                <div class="info-row"><span class="label-cell">Class</span><span class="value-cell">: ${cls}</span></div>
                <div class="info-row"><span class="label-cell">Parent No</span><span class="value-cell">: ${parent}</span></div>
            `;
        } else {
            const empId = document.getElementById('inEmpID').value;
            const desig = document.getElementById('inDesignation').value;
            const mob = document.getElementById('inTeacherMob').value;

            // Fetch from "employe images" folder
            photo.src = empId ? "Employe Images/" + empId + ".png" : "placeholder.png";

            rows.innerHTML = `
                <div class="info-row"><span class="label-cell">Employee ID</span><span class="value-cell">: ${empId}</span></div>
                <div class="info-row"><span class="label-cell">Designation</span><span class="value-cell">: ${desig}</span></div>
                <div class="info-row"><span class="label-cell">Mobile No</span><span class="value-cell">: ${mob}</span></div>
            `;
        }
    }
</script>

</body>
</html>
