<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramount | Customer Sales Ledger</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        :root {
            --paramount-green: #005a2b;
            --paramount-yellow: #f9d10d;
            --primary: #0a2351;
            --bg: #eff2f7;
            --glossy-white: rgba(255, 255, 255, 0.95);
            --glass-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.2);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at top right, #e0e5ec, #eff2f7);
            margin: 0; padding: 30px; color: #1a1a1a; min-height: 100vh;
        }

        .container { max-width: 1450px; margin: auto; }

        .nav-header {
            background: var(--glossy-white);
            backdrop-filter: blur(15px);
            padding: 20px 40px; border-radius: 24px; margin-bottom: 35px;
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: var(--glass-shadow); border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .back-btn { 
            text-decoration: none; color: var(--primary); font-weight: 700; 
            display: flex; align-items: center; gap: 12px; transition: 0.4s;
            padding: 10px 20px; border-radius: 12px; background: #fff;
            border: 1px solid #eee;
        }
        .back-btn:hover { background: #f0f0f0; transform: translateX(-5px); }

        .section { 
            background: var(--glossy-white); backdrop-filter: blur(15px);
            padding: 45px; border-radius: 35px; box-shadow: var(--glass-shadow);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h2 { 
            font-family: 'Playfair Display', serif; color: var(--primary); font-size: 2.6rem;
            margin: 0 0 10px 0; border-left: 8px solid var(--paramount-green); 
            padding-left: 20px; line-height: 1.1;
        }

        .subtitle { color: #666; font-size: 1.1rem; margin-bottom: 40px; font-weight: 400; }

        .table-container { overflow-x: auto; border-radius: 20px; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0 15px; min-width: 1200px; }
        
        th { 
            text-align: left; padding: 15px 20px; color: var(--primary); 
            font-weight: 800; font-size: 0.85rem; text-transform: uppercase; 
            letter-spacing: 1.2px; opacity: 0.8;
        }

        /* Glass row styling */
        tbody tr { transition: 0.3s; }
        
        td { 
            padding: 20px; background: white; 
            border-top: 1px solid rgba(0,0,0,0.03);
            border-bottom: 1px solid rgba(0,0,0,0.03);
            font-size: 0.95rem; vertical-align: middle;
        }

        td:first-child { border-left: 1px solid rgba(0,0,0,0.03); border-radius: 20px 0 0 20px; }
        td:last-child { border-right: 1px solid rgba(0,0,0,0.03); border-radius: 0 20px 20px 0; }

        tr:hover td { 
            background: #fff; 
            transform: translateY(-3px); 
            box-shadow: 0 15px 30px rgba(0,0,0,0.05);
            border-color: var(--paramount-yellow);
        }

        /* Specific Column Styles */
        .parent-name { font-weight: 700; color: var(--primary); font-size: 1.05rem; }
        .contact-box { color: #25D366; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .student-name { font-weight: 600; color: #333; }
        .grade-badge { 
            background: var(--primary); color: white; padding: 5px 12px; 
            border-radius: 8px; font-size: 0.75rem; font-weight: 700;
            display: inline-block; letter-spacing: 0.5px;
        }

        .book-pill { 
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: #444; padding: 6px 12px; border-radius: 8px; 
            font-size: 0.8rem; font-weight: 600; display: inline-block; 
            margin: 3px; border: 1px solid #ddd;
        }

        .total-badge {
            background: #fff8e1; color: #ff8f00; padding: 10px 18px;
            border-radius: 12px; font-weight: 800; font-size: 1.2rem;
            border: 1px solid #ffe082; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        /* Action Buttons */
        .btn-whatsapp { 
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: white; border: none; padding: 12px 20px; border-radius: 15px; 
            font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 0.85rem; 
            text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }
        .btn-whatsapp:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4); }

        .btn-delete { 
            background: #fff; color: #ff5252; border: 1px solid #ffdada; 
            padding: 12px; border-radius: 15px; cursor: pointer; transition: 0.3s;
        }
        .btn-delete:hover { background: #ff5252; color: white; border-color: #ff5252; }

        #empty-msg { text-align: center; padding: 80px; color: #999; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-header">
        <a href="BookStall.html" class="back-btn"><i class="fas fa-chevron-left"></i> BILLING DASHBOARD</a>
        <img src="logo.png" height="75" alt="Paramount Logo">
    </div>

    <div class="section">
        <h2>Paramount Sales Ledger</h2>
        <p class="subtitle">Official archive of distribution records and student digital receipts.</p>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th width="15%">Parent Name</th>
                        <th width="15%">Contact No.</th>
                        <th width="15%">Student Name</th>
                        <th width="10%">Grade</th>
                        <th width="25%">Tittle of the Book </th>
                        <th width="10%">Amount</th>
                        <th width="10%">Actions</th>
                    </tr>
                </thead>
                <tbody id="sales-body">
                    <!-- Data entries injected here -->
                </tbody>
            </table>
        </div>
        <div id="empty-msg" style="display:none;">
            <i class="fas fa-receipt" style="font-size: 4rem; margin-bottom: 20px; opacity: 0.3;"></i>
            <p>The ledger is currently empty. Start billing to see records.</p>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDRYk9KOK-ga0c88dnYMsAoifW2NJTd_Y8",
        databaseURL: "https://paramount-school-d55bc-default-rtdb.firebaseio.com",
        projectId: "paramount-school-d55bc"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const salesRef = ref(db, 'bookstall/sales');

    onValue(salesRef, (snapshot) => {
        const data = snapshot.val();
        const tbody = document.getElementById('sales-body');
        const emptyMsg = document.getElementById('empty-msg');
        tbody.innerHTML = '';

        if (!data) {
            emptyMsg.style.display = 'block';
            return;
        }
        emptyMsg.style.display = 'none';

        const records = Object.entries(data).reverse();

        records.forEach(([id, sale]) => {
            const bookListHtml = sale.items.map(item => `<span class="book-pill">${item.title}</span>`).join('');
            
            const message = encodeURIComponent(
                `*PARAMOUNT SCHOOL - DIGITAL RECEIPT*\n\n` +
                `Dear *${sale.parentName}*,\n` +
                `The following books have been issued for *${sale.studentName}*:\n\n` +
                `*Grade:* ${sale.studentGrade}\n` +
                `*Items:* \n${sale.items.map(i => "• " + i.title).join('\n')}\n\n` +
                `*Grand Total:* ₹${sale.totalAmount}\n\n` +
                `_Generated by Paramount Group of Institutions Admin._`
            );
            
            const waLink = `https://wa.me/91${sale.parentPhone}?text=${message}`;

            tbody.innerHTML += `
                <tr>
                    <td class="parent-name">${sale.parentName}</td>
                    <td>
                        <div class="contact-box">
                            <i class="fab fa-whatsapp"></i> +91 ${sale.parentPhone}
                        </div>
                    </td>
                    <td class="student-name">${sale.studentName}</td>
                    <td><span class="grade-badge">${sale.studentGrade}</span></td>
                    <td>${bookListHtml}</td>
                    <td><span class="total-badge">₹${sale.totalAmount}</span></td>
                    <td>
                        <div style="display:flex; gap:12px;">
                            <a href="${waLink}" target="_blank" class="btn-whatsapp" title="Send Receipt">
                                <i class="fab fa-whatsapp"></i> BILL
                            </a>
                            <button class="btn-delete" onclick="window.deleteRecord('${id}')" title="Delete Entry">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        });
    });

    window.deleteRecord = (id) => {
        if(confirm("Permanent Action: Remove this transaction from the Paramount Ledger?")) {
            remove(ref(db, `bookstall/sales/${id}`));
        }
    };
</script>
</body>
</html>
