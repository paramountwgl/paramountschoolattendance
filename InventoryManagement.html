        }

        .container { max-width: 1200px; margin: auto; }

        .nav-header {
            background: white; padding: 20px 40px; border-radius: 15px; margin-bottom: 25px;

        h2 { font-family: 'Playfair Display', serif; color: var(--primary); border-left: 5px solid var(--paramount-green); padding-left: 15px; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 15px; background: #f8f9fa; color: var(--primary); border-bottom: 2px solid var(--paramount-yellow); }
        td { padding: 15px; border-bottom: 1px solid #eee; }

        .sold-text { color: #d32f2f; font-weight: 600; }
        .left-text { color: #2e7d32; font-weight: 700; }

        .btn-restock {
            background: var(--paramount-green); color: white; border: 1px solid var(--paramount-yellow);
            padding: 10px 20px; border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-reset {

            const revenue = item.sold * item.mrp;

                    <td><b>${item.title}</b><br><small>${item.grade}</small></td>
                    <td style="font-weight:600">${item.total}</td>
                    <td class="sold-text">${item.sold} Sold</td>
                    <td class="left-text">${left <= 0 ? "OUT OF STOCK" : left + " Left"}</td>
                    <td><b>₹${revenue.toLocaleString()}</b></td>
                    <td>
                        <button class="btn-restock" onclick="window.handleRestock(${index})">SET STOCK</button>
                        <br><small style="color:#888; font-size:10px">Last: ${item.lastUpdate}</small>
                    </td>
                </tr>`;
        });
    }

    window.handleRestock = (index) => {
        const item = inventoryData[index];
        const newTotal = prompt(`Set Master Stock for ${item.title} (${item.grade})`, item.total);
        if (newTotal !== null && !isNaN(newTotal)) {
            inventoryData[index].total = parseInt(newTotal);
            inventoryData[index].lastUpdate = new Date().toLocaleString();
            set(stallRef, inventoryData);
        }
    };
