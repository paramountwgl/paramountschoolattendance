<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paramount | Attendance Registry</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root { 
            --p-green: #004d26; 
            --p-dark-green: #00331a;
            --p-gold: #ffd700; 
            --p-blue: #003366;
            --bg: #f8faf9;
            --white: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); margin: 0; padding-bottom: 100px; color: #333; overflow-x: hidden; width: 100%; }

        /* ULTRA-PREMIUM HEADER */
        header { 
            background: linear-gradient(135deg, var(--p-green) 0%, var(--p-dark-green) 100%);
            padding: 18px 6%; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-bottom: 4px solid var(--p-gold);
            position: sticky; top: 0; z-index: 1000;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-logo { height: 50px; filter: drop-shadow(0 0 10px rgba(255,215,0,0.2)); }
        .header-title h1 { font-family: 'Cinzel', serif; color: white; margin: 0; font-size: 1.2rem; font-weight: 900; letter-spacing: 1.5px; }
        .header-title p { color: var(--p-gold); margin: 0; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; }
        
        .header-right { display: flex; align-items: center; gap: 15px; color: white; }
        #teacherStatus { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px; }
        .btn-logout-icon { color: var(--p-gold); cursor: pointer; font-size: 1.2rem; transition: 0.3s; display: none; }
        .btn-logout-icon:hover { transform: scale(1.2); color: #ff4d4d; }

        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }

        /* PREMIUM CARDS */
        #loginCard, .selection-card, .student-list-container {
            background: var(--white);
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            border: 1px solid #f0f0f0;
        }

        #loginCard { padding: 45px 25px; text-align: center; }
        #loginCard i { font-size: 3.5rem; color: var(--p-green); margin-bottom: 20px; }
        
        .login-select {
            width: 100%; padding: 15px; border-radius: 15px; border: 2px solid #eee;
            font-size: 1rem; font-weight: 700; outline: none; background: #fdfdfd; color: var(--p-blue);
        }

        /* DASHBOARD */
        .dashboard-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-box {
            background: white; padding: 15px; border-radius: 20px; text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03); border-bottom: 4px solid var(--p-gold);
        }
        .stat-box h4 { margin: 0; font-size: 0.65rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .stat-box span { font-size: 1.8rem; font-weight: 900; color: var(--p-green); }

        .selection-card { padding: 20px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; margin-bottom: 20px; }
        .selection-card select, .selection-card input {
            width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid #eee; font-weight: 700; color: var(--p-blue); outline: none;
        }

        /* STUDENT LIST */
        .student-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 20px; border-bottom: 1px solid #f9f9f9;
        }
        .student-name { font-weight: 700; color: var(--p-blue); font-size: 0.9rem; max-width: 70%; }

        /* P/A TOGGLE */
        .switch { position: relative; display: inline-block; width: 65px; height: 36px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ff4d4d; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: "A"; height: 28px; width: 28px; left: 4px; bottom: 4px;
            background-color: white; transition: .4s; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #ff4d4d;
        }
        input:checked + .slider { background-color: var(--p-green); }
        input:checked + .slider:before { transform: translateX(29px); content: "P"; color: var(--p-green); }

        /* ACTION BUTTONS */
        .action-bar { display: none; gap: 10px; margin-top: 25px; }
        .btn-main {
            flex: 3; background: linear-gradient(135deg, var(--p-green), var(--p-dark-green));
            color: white; padding: 16px; border-radius: 15px; font-weight: 800;
            border: 1.5px solid var(--p-gold); box-shadow: 0 10px 20px rgba(0, 102, 51, 0.2);
            cursor: pointer; letter-spacing: 1px;
        }
        .btn-danger {
            flex: 1; background: #e53935; color: white; border-radius: 15px; border: none;
            box-shadow: 0 10px 20px rgba(229, 57, 53, 0.2); cursor: pointer;
        }

        /* PREMIUM APP FOOTER */
        .app-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 75px;
            background: rgba(255,255,255,0.95); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid #eee; z-index: 2000; padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            color: #aaa; text-decoration: none; font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
        }
        .nav-item.active { color: var(--p-green); }
        .nav-item i { font-size: 1.4rem; }

        .audit-trail { font-size: 0.7rem; text-align: center; color: #999; margin: 15px 0; font-style: italic; }

        @media (max-width: 480px) {
            .header-title h1 { font-size: 1rem; }
            .section { padding: 40px 5%; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <img src="logo.png" class="header-logo">
        <div class="header-title">
            <h1>Paramount</h1>
            <p>Registry System</p>
        </div>
    </div>
    <div class="header-right">
        <div id="teacherStatus">OFFLINE</div>
        <i class="fas fa-power-off btn-logout-icon" id="logoutIcon" onclick="logout()" title="Logout"></i>
    </div>
</header>

<div class="container">
    <div id="loginCard">
        <i class="fas fa-id-card-alt"></i>
        <h2 style="font-family:'Cinzel'; color:var(--p-blue); margin:0;">Staff Access</h2>
        <p style="color:#888; font-size:0.8rem; margin:10px 0 25px;">Select your profile to start attendance</p>
        <select id="teacherSelect" class="login-select" onchange="authenticateTeacher()">
            <option value="">-- Identify Staff --</option>
            <option value="Mr. Shaik Ahmad">Mr. Shaik Ahmad</option>
            <option value="Ms. Riha">Ms. Riha (IIT)</option>
            <option value="Ms. Raniya Zainab">Ms. Raniya Zainab (Physics)</option>
            <option value="Ms. Roqiya Begum">Ms. Roqiya Begum</option>
            <option value="Ms. G.Rajitha">Ms. G.Rajitha</option>
            <option value="Ms. Ameena Tabassum">Ms. Ameena Tabassum</option>
            <option value="Ms. Shaik Shabana">Ms. Shaik Shabana</option>
            <option value="Ms. B.Ravali">Ms. B.Ravali</option>
            <option value="Ms. L.Kalyani">Ms. L.Kalyani</option>
            <option value="Ms. J.Alaya Sree">Ms. J.Alaya Sree</option>
            <option value="Ms. S.Sujatha">Ms. S.Sujatha</option>
            <option value="Ms. J.Prathibha">Ms. J.Prathibha</option>
            <option value="Ms. P.Shailaja">Ms. P.Shailaja</option>
            <option value="Ms. A.Jhansi Rani">Ms. A.Jhansi Rani</option>
            <option value="Ms. S. Neelima">Ms. S. Neelima</option>
        </select>
    </div>

    <div id="registryUI" style="display:none;">
        <div class="dashboard-stats">
            <div class="stat-box"><h4>Present</h4><span id="presentCount">0</span></div>
            <div class="stat-box"><h4>Absent</h4><span id="absentCount">0</span></div>
        </div>

        <div class="selection-card">
            <select id="attClass" onchange="loadStudents()">
                <option value="">-- Class --</option>
            </select>
            <input type="date" id="attDate" onchange="loadStudents()">
        </div>

        <div id="auditText" class="audit-trail"></div>

        <div class="student-list-container" id="studentList">
            </div>

        <div class="action-bar" id="actionBar">
            <button class="btn-main" onclick="saveData()">COMMIT REGISTRY <i class="fas fa-check-circle"></i></button>
            <button class="btn-danger" id="delBtn" onclick="deleteEntry()" style="display:none;"><i class="fas fa-trash"></i></button>
        </div>
    </div>
</div>

<nav class="app-footer">
    <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
    <a href="teacher.html" class="nav-item"><i class="fas fa-user-tie"></i><span>Portal</span></a>
    <a href="#" class="nav-item active"><i class="fas fa-clipboard-list"></i><span>Registry</span></a>
    <a href="tel:+919652188807" class="nav-item"><i class="fas fa-headset"></i><span>Support</span></a>
</nav>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyDRYk9KOK-ga0c88dnYMsAoifW2NJTd_Y8", 
        databaseURL: "https://paramount-school-d55bc-default-rtdb.firebaseio.com", 
        projectId: "paramount-school-d55bc" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const registry = { "Mr. Shaik Ahmad": "Ahmad@123", "Ms. Riha": "Riha@123", "Ms. Raniya Zainab": "Raniya@123", "Ms. Roqiya Begum": "Roqiya@123", "Ms. G.Rajitha": "Rajitha@123", "Ms. Ameena Tabassum": "Ameena@123", "Ms. Shaik Shabana": "Shabana@123", "Ms. B.Ravali": "Ravali@123", "Ms. L.Kalyani": "Kalyani@123", "Ms. J.Alaya Sree": "Alaya@123", "Ms. S.Sujatha": "Sujatha@123", "Ms. J.Prathibha": "Prathibha@123", "Ms. P.Shailaja": "Phailaja@123", "Ms. A.Jhansi Rani": "Jhansi@123", "Ms. S. Neelima": "Neelima@123" };
    
    const studentData = { "Pre-KG": ["Hanish Macharla", "Arjun Vihaar Illandula", "Thanu sree Allakunta", "Aadhya Gangaraboina", "Aadhya Sri Oggula", "Aadhyasri Shivagoni", "Afraha Begum", "Aliya Sultana", "Anvika Bandi", "Aradana Devara konda", "Devansh Bandi", "Hanvitha Mulkalapelli", "Harsha Vardhan Seenapelli", "Hiranya Bandi", "Jashritha Boina", "Konreddy Shreyanvi", "Kriyansh Sammeta", "Mohammed Mohiuddin Sayyad", "Nethra Narkurthi", "Reeyansh Bandi", "Rishi Manupati", "Rudransh Bandi", "Sanvika Bandi", "Shanvith Khatha", "Shishira Jalagam", "Shiva Sai Mekala", "Shree Rudhraveer Chevvu", "Shreyansh Gangaraboina", "Sreeja Thalla", "Srikrithini Myakala", "Srivatsav Vanam", "Sriyansh Mekala", "Thanvika Lakka", "Thrilokansh Vudari", "Ujjwal Chekka", "Vaishnavi Lakka", "Vedansh Myakala", "Vishnu Priya Molugu", "Vyshnav Tej Boina", "Yafiah Mohammad"], "KG-1": ["Aadhya Sri Amaravadi", "Aditya Manda", "Aadhya Jella", "Advaita Gauri Bandi", "Aizah Amna Shaik", "Akshara Singaram", "Bhahuveer Raj Somishetti", "Gayathri Erroju", "Hanvika Mulkalapelli", "Manvith Kondoju", "Sayyad Vajeed", "Mekala Manu sri", "Oliva Grace Vallapu", "Rithwik Oggula", "Rithwika Kandagatla", "Srimahi Chevvu", "Thanvesh Thalla", "Trishul Nanduri", "Yoganshika Nanduri", "Yusra Mohammad", "Zainul Abideen Syed"], "KG-2": ["Deekshanth Sammeta", "Hanshith Erroju", "Harika Bandi", "Himarsha Naini", "Karthik Vallepu", "Kruthika Bandi", "Rajavardhan Gampala", "Roshan Kaitha", "Sri Anshu Ayaan Lyadala", "Srihansh Bandi", "Srikshitha Guduri", "Varshith Gonela", "Adyasri Makala", "Anvik Boini", "Anvith Pokanati", "Awais Ur Rehman Mohammad", "Dakshu Pothuganti", "Hansith Reddy Katukuri", "Harshith Pokanati", "Jella Aditya", "Krishank Nallabothula", "Kundana Katkuri", "Munukuntla Revanth Rudhra", "Niraja Nethri Siluveru", "Pranav Mattepelli", "Sreenith Yadav Naini", "Uvan Reddy Dasari", "Zayan Mohammad", "Zoya Mohammed"], "Grade-1": ["Dheeraj Gattu", "Preetham Sannayala", "Shiva nandu Gonela", "Shrayan Nuthanakanti", "Sriyanksha Mandala", "Advitha Garige", "Harika Bandi", "Himansi Kondoju", "Izhaan Rahamath Syed", "Jaisurya Myakala", "Khadeeja Fathima", "Manaswini Dandugula", "Manusri Bandi", "Rithwik krishna Amaravadi", "Rohan Bandi", "Shiva Junnu", "Shivanandh Bandi", "Sridha Thalla", "Srinika Chengelly", "Sriyanshi Oggula", "Vishwak Chekka"], "Grade-2": ["Aliza Manha Shaik", "Dhruvan Reddy Katukuri", "Druthika Enugala", "Manaswini Bandi", "Rakshith Macharla", "Sathwika Katkuri", "Shalini Uppala", "Chandu Devarakonda", "Gnaneshwar Pokanati", "Hasnain Syed", "Koushik Siluveru", "Senen Erasabattula", "Shivarajan Pothuganti"], "Grade-3": ["Nagavelly Manikanta", "Mirja Ismail", "Bandi Aryan", "Dandugula Mahesh Babu", "Bandi Tejasri", "Bandi Harshavardhan", "Gampala Vyshnavi", "Gampala Laxmi", "Garige Harshith", "Katkuri Hanish", "Katukuri Manideep", "MD Abdul Quddus", "Muppa Sathwik Patel", "Nuthanakanti Sansita", "Pasarakonda Ritwin", "Pinninti Rakshith Rao", "Rayi Sriman Adithya"], "Grade-4": ["Abdul Saqib Mohammad", "Anudeep Chintha", "Bhavan Bandi", "Harshavardhan Gonela", "Jayadev Chiluveru", "Mahaboob Syed", "Nandith Reddy Enugala", "Sai Charan Goud Mandala", "Sai Prasanna Keerthi", "Ajmeri Shaik", "Akshara Chiluveru", "Jayasri Myakala", "Rahul Kanjarla", "Saketh Devarakonda"], "Grade-5": ["Adya Reddy Vangala", "Kowshik Patel Muppa", "Siri Singaram", "Srikar Mandala", "Abdus Salaam MD", "Akshith Ram Kalvacharla", "Jaffar Anas Shaik", "Khaja Azeemuddin Mohammed", "Nihan Mohammed", "Saif Shaik", "Saketh Renukuntla", "Sreeja Dasari", "Vidhaatri Sahani"], "Grade-6": ["Abdul Razzak Mohammad", "Anudeepthi Chintha", "Saketh Ranaveni", "Shiva Sri Katukuri", "Aklees Shaik", "Akshya Kalvacharla", "Prince Katkuri"], "Grade-7": ["Manikanta Sannayala", "Sreeyan Reddy Karra", "Jayadhithya Chiluveru"], "Grade-8": ["Sathwika Nagavelly", "Vyshnavi Uppala", "Akshaya Gampala", "Ganesh Oggula", "Gayathri Renukuntla", "Khaja Sadeemuddin Mohammed"] };

    let activeTeacher = "";
    document.getElementById('attDate').valueAsDate = new Date();

    const clsSel = document.getElementById('attClass');
    Object.keys(studentData).forEach(c => clsSel.innerHTML += `<option value="${c}">${c}</option>`);

    async function authenticateTeacher() {
        const val = document.getElementById('teacherSelect').value;
        if(!val) return;
        const { value: pin } = await Swal.fire({ title: 'Security PIN', input: 'password', confirmButtonColor: '#004d26' });
        if(pin === registry[val]) {
            activeTeacher = val;
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('registryUI').style.display = 'block';
            document.getElementById('logoutIcon').style.display = 'block';
            document.getElementById('teacherStatus').innerHTML = `<span style="color:var(--p-gold)">●</span> ${val.split(' ')[1]}`;
        } else {
            Swal.fire('Error', 'Invalid PIN', 'error');
            document.getElementById('teacherSelect').value = "";
        }
    }

    function logout() {
        Swal.fire({
            title: 'Logout?',
            text: "Another staff member will need to sign in.",
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#004d26',
            cancelButtonColor: '#d33',
            confirmButtonText: 'Yes, Sign Out'
        }).then((result) => {
            if (result.isConfirmed) {
                // Reset State
                activeTeacher = "";
                document.getElementById('loginCard').style.display = 'block';
                document.getElementById('registryUI').style.display = 'none';
                document.getElementById('logoutIcon').style.display = 'none';
                document.getElementById('teacherStatus').innerText = "OFFLINE";
                document.getElementById('teacherSelect').value = "";
                document.getElementById('studentList').innerHTML = "";
                document.getElementById('presentCount').innerText = "0";
                document.getElementById('absentCount').innerText = "0";
                document.getElementById('auditText').innerText = "";
            }
        });
    }

    async function loadStudents() {
        const c = document.getElementById('attClass').value;
        const d = document.getElementById('attDate').value;
        if(!c || !d) return;

        const list = document.getElementById('studentList');
        list.innerHTML = '<div style="text-align:center; padding:30px;"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';

        const snap = await db.ref(`daily_attendance/${d}/${c}`).once('value');
        const data = snap.val();

        list.innerHTML = (studentData[c] || []).map(name => {
            let p = (data && data.records && data.records[name] !== undefined) ? data.records[name] : true;
            return `<div class="student-item"><span class="student-name">${name}</span><label class="switch"><input type="checkbox" class="tgl" data-name="${name}" ${p?'checked':''} onchange="liveCount()"><span class="slider"></span></label></div>`;
        }).join('');

        document.getElementById('auditText').innerText = data ? `Last sync by ${data.updatedBy} at ${data.updatedAt}` : "No records found for this selection.";
        document.getElementById('delBtn').style.display = data ? 'block' : 'none';
        document.getElementById('actionBar').style.display = 'flex';
        liveCount();
    }

    function liveCount() {
        const t = document.querySelectorAll('.tgl');
        let p = 0, a = 0;
        t.forEach(i => i.checked ? p++ : a++);
        document.getElementById('presentCount').innerText = p;
        document.getElementById('absentCount').innerText = a;
    }

    function saveData() {
        const c = document.getElementById('attClass').value;
        const d = document.getElementById('attDate').value;
        if(!c || !d) { Swal.fire('Error', 'Select class and date', 'error'); return; }
        
        const now = new Date();
        const stamp = now.toLocaleDateString() + " " + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

        const recs = {};
        document.querySelectorAll('.tgl').forEach(i => recs[i.getAttribute('data-name')] = i.checked);

        Swal.fire({ title: 'Syncing...', didOpen: () => Swal.showLoading() });
        db.ref(`daily_attendance/${d}/${c}`).set({ records: recs, updatedBy: activeTeacher, updatedAt: stamp }).then(() => {
            Swal.fire({ icon: 'success', title: 'Data Secured', timer: 1000 });
            loadStudents();
        });
    }

    async function deleteEntry() {
        const c = document.getElementById('attClass').value;
        const d = document.getElementById('attDate').value;
        const res = await Swal.fire({ title: 'Erase Data?', text: 'This will remove the day\'s record.', icon: 'warning', showCancelButton: true, confirmButtonColor: '#e53935' });
        if(res.isConfirmed) {
            db.ref(`daily_attendance/${d}/${c}`).remove().then(() => {
                Swal.fire('Deleted', 'Record removed.', 'success');
                loadStudents();
            });
        }
    }
</script>
</body>
</html>
