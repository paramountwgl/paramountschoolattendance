.report-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
    z-index: 3000; display: none; align-items: center; justify-content: center;
}
.report-content {
    background: white; width: 95%; max-width: 800px; height: 80vh;

}
.report-header {
    background: var(--p-green); color: white; padding: 20px;
    display: flex; justify-content: space-between; align-items: center;
}
.report-body { padding: 10px; overflow: auto; flex: 1; } /* Allow scrolling */
.report-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; text-align: center; white-space: nowrap; }
.report-table th, .report-table td { border: 1px solid #eee; padding: 8px; }
.report-table td { padding: 12px; border-bottom: 1px solid #eee; font-weight: 600; }
.rep-present { color: #2e7d32; }
.rep-absent { color: #c62828; }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); margin: 0; padding-bottom: 120px; color: #333; overflow-x: hidden; width: 100%; }

            background: linear-gradient(135deg, var(--p-green) 0%, var(--p-dark-green) 100%);

        .header-right { display: flex; align-items: center; gap: 15px; }
        #teacherStatus { font-size: 0.75rem; font-weight: 700; color: white; }

        .logout-wrapper span { font-size: 0.7rem; font-weight: 800; color: white; text-transform: uppercase; }
        .logout-wrapper:hover { background: var(--danger); border-color: white; }

        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }

        #loginCard, .selection-card, .student-list-container, .tool-strip {
            background: var(--white); border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); border: 1px solid #f0f0f0;

        #loginCard { padding: 45px 25px; text-align: center; }

        .login-select { width: 100%; padding: 15px; border-radius: 15px; border: 2px solid #eee; font-size: 1rem; font-weight: 700; outline: none; background: #fdfdfd; color: var(--p-blue); }

        .dashboard-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-box { background: white; padding: 15px; border-radius: 20px; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.03); border-bottom: 4px solid var(--p-gold); }
        .stat-box h4 { margin: 0; font-size: 0.65rem; color: #888; text-transform: uppercase; }
        .stat-box span { font-size: 1.8rem; font-weight: 900; color: var(--p-green); }

        .selection-card { padding: 20px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; margin-bottom: 15px; }
        .selection-card select, .selection-card input { width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid #eee; font-weight: 700; color: var(--p-blue); outline: none; }

        /* TOOL STRIP (Bulk Toggle) */
        .tool-strip { padding: 15px 25px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; background: #f0f4f2; border-left: 5px solid var(--p-green); }
        .tool-label { font-size: 0.8rem; font-weight: 800; color: var(--p-green); text-transform: uppercase; }

        .student-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid #f9f9f9; }
        .student-info { display: flex; flex-direction: column; gap: 4px; max-width: 65%; }
        .student-name { font-weight: 700; color: var(--p-blue); font-size: 0.9rem; }
        
        /* Analytics Badge */
        .trend-badge { font-size: 0.6rem; font-weight: 800; padding: 3px 8px; border-radius: 5px; width: fit-content; }
        .trend-good { background: #e8f5e9; color: #2e7d32; }
        .trend-bad { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; animation: pulse 2s infinite; }

        .switch { position: relative; display: inline-block; width: 60px; height: 32px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ff4d4d; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: "A"; height: 24px; width: 24px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: #ff4d4d; }
        input:checked + .slider { background-color: var(--p-green); }
        input:checked + .slider:before { transform: translateX(28px); content: "P"; color: var(--p-green); }

        .action-bar { display: none; flex-direction: column; gap: 10px; margin-top: 25px; }
        .btn-main { width: 100%; background: linear-gradient(135deg, var(--p-green), var(--p-dark-green)); color: white; padding: 16px; border-radius: 15px; font-weight: 800; border: 1.5px solid var(--p-gold); cursor: pointer; box-shadow: 0 10px 20px rgba(0, 102, 51, 0.2); }

        .btn-danger { background: var(--danger); color: white; padding: 12px; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; }

</head>

    async function deleteMonthlyData() {
    const c = document.getElementById('attClass').value;
    const d = document.getElementById('attDate').value;
    const monthYear = d.substring(0, 7); // Gets YYYY-MM

    // 1. High-Level Security Confirmation
    const { value: confirmWord } = await Swal.fire({
        title: 'CRITICAL ACTION',
        html: `You are about to delete <b>ALL</b> attendance records for <b>${c}</b> in the month of <b>${monthYear}</b>.<br><br>Type <b> Admin password</b> to confirm:`,
        input: 'text',
        icon: 'error',
        showCancelButton: true,
        confirmButtonColor: '#e53935',
        confirmButtonText: 'Permanently Erase Month',
        inputValidator: (value) => {
            if (!value || value !== 'Ahmad@07') {
                return 'You must type DELETE to proceed!';
            }
        }
    });

    if (confirmWord === 'DELETE') {
        Swal.fire({ title: 'Processing Bulk Erasure...', didOpen: () => Swal.showLoading() });

        try {
            // Get all days in the database
            const snap = await db.ref(`daily_attendance`).once('value');
            const allDays = snap.val() || {};
            
            let deletePromises = [];

            // Loop through days and find matches for the month
            Object.keys(allDays).forEach(day => {
                if(day.startsWith(monthYear) && allDays[day][c]) {
                    // Prepare the deletion of this class for this day
                    deletePromises.push(db.ref(`daily_attendance/${day}/${c}`).remove());
                }
            });

            if(deletePromises.length > 0) {
                await Promise.all(deletePromises);
                Swal.fire('Success', `Deleted ${deletePromises.length} days of data for ${c}.`, 'success');
                closeReport(); // Close the modal
                loadStudents(); // Refresh main list
            } else {
                Swal.fire('No Data', 'No records were found to delete for this month.', 'info');
            }
        } catch (error) {
            Swal.fire('System Error', error.message, 'error');
        }
    }
}
    async function generateMonthlyReport() {
    const c = document.getElementById('attClass').value;
    const d = document.getElementById('attDate').value;
    if(!c || !d) { Swal.fire('Wait', 'Select Class & Date first', 'info'); return; }

    const monthYear = d.substring(0, 7);
    const snap = await db.ref(`daily_attendance`).once('value');
    const allData = snap.val() || {};

    document.getElementById('repClassName').innerText = `CLASS: ${c}`;
    document.getElementById('repDateRange').innerText = `REPORT FOR: ${monthYear}`;

    // Find all days in this month where THIS class has records
    const monthDays = Object.keys(allData).filter(day => 
        day.startsWith(monthYear) && allData[day][c] && allData[day][c].records
    ).sort();

    // 1. Build Header Row (Name + Dates + Stats)
    let headHTML = `<tr><th style="text-align:left;">Student Name</th>`;
    monthDays.forEach(day => { headHTML += `<th>${day.split('-')[2]}</th>`; }); // Just show Day number
    headHTML += `<th>Days</th><th>P</th><th>A</th><th>%</th></tr>`;
    document.getElementById('reportHead').innerHTML = headHTML;

    // 2. Build Student Rows
    let bodyHTML = "";
    const students = studentData[c] || [];

    students.forEach(name => {
        let pCount = 0, tCount = 0;
        let row = `<tr><td style="text-align:left; font-weight:800;">${name}</td>`;
        
        monthDays.forEach(day => {
            const status = allData[day][c].records[name];
            if(status !== undefined) {
                tCount++;
                if(status) { pCount++; row += `<td style="color:#2e7d32">P</td>`; }
                else { row += `<td style="color:#e53935">A</td>`; }
            } else {
                row += `<td>-</td>`;
            }
        });

        const absent = tCount - pCount;
        const per = tCount > 0 ? Math.round((pCount/tCount)*100) : 0;
        
        row += `<td>${tCount}</td>
                <td style="color:#2e7d32">${pCount}</td>
                <td style="color:#e53935">${absent}</td>
                <td style="font-weight:900; color:${per < 75 ? 'red' : 'black'}">${per}%</td></tr>`;
        bodyHTML += row;
    });

    document.getElementById('reportTableBody').innerHTML = bodyHTML || "<tr><td colspan='100%'>No data found.</td></tr>";
    document.getElementById('reportOverlay').style.display = 'flex';
}
function closeReport() {
    document.getElementById('reportOverlay').style.display = 'none';
}

    async function loadStudents() {
        const c = document.getElementById('attClass').value;
        const d = document.getElementById('attDate').value;
        if(!c || !d) return;

        const list = document.getElementById('studentList');
        list.innerHTML = '<div style="text-align:center; padding:30px;"><i class="fas fa-spinner fa-spin"></i> Analyzing...</div>';

        // Load Analytics
        const monthYear = d.substring(0, 7); 
        const monthSnap = await db.ref(`daily_attendance`).once('value');
        const allDays = monthSnap.val() || {};

        const snap = await db.ref(`daily_attendance/${d}/${c}`).once('value');
        const data = snap.val();

        list.innerHTML = (studentData[c] || []).map(name => {
            let p = (data && data.records && data.records[name] !== undefined) ? data.records[name] : true;
            
            // Calculate Monthly %
            let totalMonth = 0, presentMonth = 0;
            Object.keys(allDays).forEach(day => {
                if(day.startsWith(monthYear) && allDays[day][c] && allDays[day][c].records && allDays[day][c].records[name] !== undefined) {
                    totalMonth++;
                    if(allDays[day][c].records[name]) presentMonth++;
                }
            });

            // LOGIC FIX: Check if data exists before calculating %
            let badgeHTML = '';
            if (totalMonth > 0) {
                const percent = Math.round((presentMonth / totalMonth) * 100);
                const trendClass = percent < 75 ? 'trend-bad' : 'trend-good';
                badgeHTML = `<span class="trend-badge ${trendClass}">${percent}% Monthly Attendance</span>`;
            } else {
                // Neutral state for new months or new students
                badgeHTML = `<span class="trend-badge" style="background:#eee; color:#666;">No History Yet</span>`;
            }

            return `
                <div class="student-item">
                    <div class="student-info">
                        <span class="student-name">${name}</span>
                        ${badgeHTML}
                    </div>
                    <label class="switch">
                        <input type="checkbox" class="tgl" data-name="${name}" ${p?'checked':''} onchange="liveCount()">
                        <span class="slider"></span>
                    </label>
                </div>`;
        }).join('');

        document.getElementById('bulkStrip').style.display = 'flex';
        document.getElementById('auditText').innerText = data ? `Synced by ${data.updatedBy}` : "Pending Today's Registry";
        document.getElementById('delBtn').style.display = data ? 'block' : 'none';
        document.getElementById('waNotifyBtn').style.display = data ? 'block' : 'none';
        document.getElementById('actionBar').style.display = 'flex';
        liveCount();
    }

    function bulkToggle(src) {
        document.querySelectorAll('.tgl').forEach(i => i.checked = src.checked);
        liveCount();
    }

    function liveCount() {
        const t = document.querySelectorAll('.tgl');
        let p = 0, a = 0;
        t.forEach(i => i.checked ? p++ : a++);
        document.getElementById('presentCount').innerText = p;
        document.getElementById('absentCount').innerText = a;
    }

    function saveData() {
        const c = document.getElementById('attClass').value;
        const d = document.getElementById('attDate').value;
        const stamp = new Date().toLocaleString();
        const recs = {};
        document.querySelectorAll('.tgl').forEach(i => recs[i.getAttribute('data-name')] = i.checked);

        Swal.fire({ title: 'Securing...', didOpen: () => Swal.showLoading() });
        db.ref(`daily_attendance/${d}/${c}`).set({ records: recs, updatedBy: activeTeacher, updatedAt: stamp }).then(() => {
            Swal.fire({ icon: 'success', title: 'Secured', timer: 1000 });
            loadStudents();
        });
    }

    function sendWANotifications() {
        const absentees = [];
        document.querySelectorAll('.tgl').forEach(i => {
            if(!i.checked) absentees.push(i.getAttribute('data-name'));
        });

        if(absentees.length === 0) {
            Swal.fire('Perfect!', 'All students are present today.', 'success');
            return;
        }

        const listText = absentees.join(', ');
        const dateStr = document.getElementById('attDate').value;
        const message = encodeURIComponent(`Paramount School Alert: Student(s) [${listText}] marked ABSENT on ${dateStr}. Please check.`);
        window.open(`https://wa.me/?text=${message}`, '_blank');
    }

    function logout() { location.reload(); }
    async function deleteEntry() {
        const c = document.getElementById('attClass').value;
        const d = document.getElementById('attDate').value;
        const res = await Swal.fire({ title: 'Wipe Registry?', text: 'Irreversible action.', icon: 'warning', showCancelButton: true });
        if(res.isConfirmed) db.ref(`daily_attendance/${d}/${c}`).remove().then(() => loadStudents());
    }
</script>
   <div id="reportOverlay" class="report-overlay">
    <div class="report-content">
        <div class="report-header">
            <div>
                <h2 id="repClassName" style="margin:0; font-family:'Cinzel';">MONTHLY DATA</h2>
                <p id="repDateRange" style="margin:0; font-size:0.7rem; color:var(--p-gold);"></p>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <button onclick="deleteMonthlyData()" style="background:rgba(255,0,0,0.2); color:white; border:1px solid white; padding:5px 10px; border-radius:5px; font-size:10px; cursor:pointer; font-weight:bold;">
                    <i class="fas fa-calendar-times"></i> DELETE MONTH
                </button>
                <i class="fas fa-times-circle" style="font-size:1.5rem; cursor:pointer;" onclick="closeReport()"></i>
            </div>
        </div>
        <div class="report-body">
            <table class="report-table">
                <thead id="reportHead"></thead> <tbody id="reportTableBody"></tbody>
            </table>
        </div>
    </div>
</div>
