<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Event Panel | Paramount School</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Segoe+UI:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        :root { --forest: #004d26; --gold: #ffd700; --light: #f4f7f6; --danger: #d32f2f; --info: #0288d1; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); margin: 0; min-height: 100vh; padding-bottom: 50px; }
        
        /* PRIVATE LOGIN OVERLAY */
        #authOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--forest); display:flex; align-items:center; justify-content:center; z-index:9999; padding: 20px; }
        .auth-card { background: white; width: 100%; max-width: 350px; padding: 40px 30px; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.3); text-align: center; }
        .auth-input { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #e0e0e0; background: #fafafa; font-size: 15px; outline: none; text-align: center; }
        
        .btn-cancel-return { display: inline-flex; align-items: center; gap: 8px; color: #888; text-decoration: none; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; transition: 0.3s; padding: 10px 20px; border-radius: 50px; }
        .btn-cancel-return:hover { color: var(--danger); background: rgba(211, 47, 47, 0.05); }

        /* MAIN PANEL */
        .admin-card { max-width: 800px; margin: 40px auto; background: white; padding: 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); border-top: 8px solid var(--forest); position: relative; }
        
        /* PREMIUM TOP BAR */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .btn-back-dash { text-decoration: none; color: var(--forest); font-weight: 800; font-size: 12px; display: flex; align-items: center; gap: 8px; border: 2px solid var(--forest); padding: 8px 15px; border-radius: 50px; transition: 0.3s; }
        .btn-back-dash:hover { background: var(--forest); color: white; }

        .school-header-row { display: flex; align-items: center; gap: 15px; }
        .school-logo-img { height: 45px; }
        .school-text-box { display: flex; flex-direction: column; line-height: 1.1; }
        .school-name-main { font-family: 'Montserrat'; font-size: 1.1rem; font-weight: 800; color: var(--forest); }
        .school-name-sub { font-size: 0.7rem; color: #b8860b; font-weight: 700; text-transform: uppercase; }

        h2 { color: var(--forest); font-family: 'Montserrat'; text-align: center; margin: 20px 0; text-transform: uppercase; letter-spacing: 1px; font-size: 1.2rem; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; color: #888; margin-bottom: 6px; }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #eee; font-size: 14px; outline: none; }
        input:focus { border-color: var(--forest); }
        
        .btn-action { width: 100%; background: var(--forest); color: white; padding: 16px; border-radius: 50px; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.3s; margin-top:10px;}
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        /* LIVE EVENTS LIST */
        .events-list { margin-top: 40px; border-top: 3px solid var(--gold); padding-top: 25px; }
        .event-card-item { display: flex; justify-content: space-between; align-items: center; background: #fcfcfc; padding: 15px; border-radius: 15px; margin-bottom: 12px; border: 1px solid #eee; }
        .ev-data b { display: block; color: var(--forest); font-size: 15px; }
        .ev-data span { display: block; color: #777; font-size: 12px; margin-top: 4px; }
        .ev-data small { color: #b8860b; font-weight: 700; font-size: 10px; }
        
        .btn-group { display: flex; gap: 10px; }
        .icon-btn { width: 35px; height: 35px; border-radius: 10px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .edit-btn { background: #e3f2fd; color: #1976d2; }
        .edit-btn:hover { background: #1976d2; color: white; }
        .del-btn { background: #ffebee; color: #d32f2f; }
        .del-btn:hover { background: #d32f2f; color: white; }
    </style>
</head>
<body>

<div id="authOverlay">
    <div class="auth-card">
        <img src="logo.png" style="height:70px; margin-bottom:15px;">
        <h2>ADMIN ACCESS</h2>
        <input type="password" id="adminPassInput" class="auth-input" placeholder="Enter Private Password">
        <button class="btn-action" style="background:var(--gold); color:var(--forest);" onclick="authenticate()">UNLOCK PANEL</button>
        <div style="margin-top: 20px;"><a href="admin.html" class="btn-cancel-return"><i class="fas fa-times"></i> Cancel</a></div>
    </div>
</div>

<div class="admin-card" id="mainPanel" style="display:none;">
    <div class="top-bar">
        <div class="school-header-row">
            <img src="logo.png" class="school-logo-img">
            <div class="school-text-box">
                <span class="school-name-main">PARAMOUNT</span>
                <span class="school-name-sub">Event Control</span>
            </div>
        </div>
        <a href="admin.html" class="btn-back-dash"><i class="fas fa-th-large"></i> Dashboard</a>
    </div>

    <h2 id="formHeader">Publish New Event</h2>
    
    <input type="hidden" id="editId">
    <div class="input-group">
        <label>Event Name</label>
        <input type="text" id="evName" placeholder="e.g. Science Fair">
    </div>
    <div class="input-group">
        <label>Description</label>
        <input type="text" id="evDesc" placeholder="e.g. Join the innovation hub">
    </div>
    <div class="input-group">
        <label>Event Date</label>
        <input type="datetime-local" id="evDate">
    </div>
    <div class="input-group">
        <label>Registration Deadline</label>
        <input type="datetime-local" id="regDeadline">
    </div>

    <button id="btnSave" class="btn-action" onclick="saveEvent()">PUBLISH NOW</button>
    <button id="btnUpdate" class="btn-action" style="display:none; background:var(--info);" onclick="updateEvent()">SAVE CHANGES</button>
    <button id="btnCancel" class="btn-action" style="display:none; background:#888;" onclick="resetForm()">CANCEL EDIT</button>

    <div class="events-list">
        <h3 style="font-family: Montserrat; color: var(--forest); font-size: 14px;"><i class="fas fa-list-ul"></i> LIVE EVENTS ON PORTAL</h3>
        <div id="liveList"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDRYk9KOK-ga0c88dnYMsAoifW2NJTd_Y8", databaseURL: "https://paramount-school-d55bc-default-rtdb.firebaseio.com", projectId: "paramount-school-d55bc" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function authenticate() {
        if(document.getElementById('adminPassInput').value === "Ahmad@07") {
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('mainPanel').style.display = 'block';
        } else {
            Swal.fire('Denied', 'Wrong Password', 'error');
        }
    }

    function saveEvent() {
        const name = document.getElementById('evName').value;
        const desc = document.getElementById('evDesc').value;
        const date = document.getElementById('evDate').value;
        const deadline = document.getElementById('regDeadline').value;

        if(!name || !date || !deadline) return Swal.fire('Error', 'Fill required fields', 'warning');

        db.ref('school_events').push({ name, desc, date, regDeadline: deadline }).then(() => {
            Swal.fire('Success', 'Event Published', 'success');
            resetForm();
        });
    }

    // LOAD AND SYNC EVENTS LIST
    db.ref('school_events').on('value', snap => {
        const listDiv = document.getElementById('liveList');
        listDiv.innerHTML = '';
        if(!snap.exists()) listDiv.innerHTML = '<p style="text-align:center; color:#ccc;">No events found.</p>';

        snap.forEach(child => {
            const ev = child.val();
            listDiv.innerHTML += `
                <div class="event-card-item">
                    <div class="ev-data">
                        <b>${ev.name}</b>
                        <span>${ev.desc}</span>
                        <small><i class="fas fa-calendar"></i> ${ev.date.replace('T',' ')}</small>
                    </div>
                    <div class="btn-group">
                        <button class="icon-btn edit-btn" onclick="editMode('${child.key}', \`${ev.name}\`, \`${ev.desc}\`, '${ev.date}', '${ev.regDeadline}')"><i class="fas fa-pen"></i></button>
                        <button class="icon-btn del-btn" onclick="deleteEvent('${child.key}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
        });
    });

    function editMode(id, name, desc, date, deadline) {
        document.getElementById('editId').value = id;
        document.getElementById('evName').value = name;
        document.getElementById('evDesc').value = desc;
        document.getElementById('evDate').value = date;
        document.getElementById('regDeadline').value = deadline;

        document.getElementById('formHeader').innerText = "Edit Event Details";
        document.getElementById('btnSave').style.display = 'none';
        document.getElementById('btnUpdate').style.display = 'block';
        document.getElementById('btnCancel').style.display = 'block';
        window.scrollTo(0,0);
    }

    function updateEvent() {
        const id = document.getElementById('editId').value;
        const data = {
            name: document.getElementById('evName').value,
            desc: document.getElementById('evDesc').value,
            date: document.getElementById('evDate').value,
            regDeadline: document.getElementById('regDeadline').value
        };
        db.ref('school_events/' + id).update(data).then(() => {
            Swal.fire('Updated', 'Changes saved successfully', 'success');
            resetForm();
        });
    }

    function deleteEvent(id) {
        Swal.fire({
            title: 'Are you sure?',
            text: "This event will be permanently removed.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d32f2f',
            confirmButtonText: 'Delete Now'
        }).then((result) => {
            if (result.isConfirmed) {
                db.ref('school_events/' + id).remove();
            }
        });
    }

    function resetForm() {
        document.getElementById('editId').value = '';
        document.getElementById('evName').value = '';
        document.getElementById('evDesc').value = '';
        document.getElementById('evDate').value = '';
        document.getElementById('regDeadline').value = '';
        document.getElementById('formHeader').innerText = "Publish New Event";
        document.getElementById('btnSave').style.display = 'block';
        document.getElementById('btnUpdate').style.display = 'none';
        document.getElementById('btnCancel').style.display = 'none';
    }
</script>
</body>
</html>
