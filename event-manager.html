<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Event Panel | Paramount School</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Segoe+UI:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        :root { --forest: #004d26; --gold: #ffd700; --light: #f4f7f6; --danger: #d32f2f; --info: #0288d1; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); margin: 0; min-height: 100vh; padding-bottom: 50px; scroll-behavior: smooth; }
        
        /* PRIVATE LOGIN OVERLAY */
        #authOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--forest); display:flex; align-items:center; justify-content:center; z-index:9999; padding: 20px; }
        .auth-card { background: white; width: 100%; max-width: 420px; padding: 40px 30px; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.3); text-align: center; }
        .auth-input { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #e0e0e0; background: #fafafa; font-size: 15px; outline: none; text-align: center; }
        
        /* PREMIUM BACK BUTTON */
        .btn-back-dash {
            text-decoration: none; color: var(--forest); font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
            display: flex; align-items: center; gap: 10px; background: white; border: 2px solid #f0f0f0; padding: 10px 20px; border-radius: 50px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .btn-back-dash i { background: var(--forest); color: var(--gold); width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 10px; }
        .btn-back-dash:hover { border-color: var(--forest); transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0, 102, 51, 0.15); }

        .admin-card { max-width: 850px; margin: 40px auto; background: white; padding: 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); border-top: 8px solid var(--forest); position: relative; }
        
        h2 { color: var(--forest); font-family: 'Montserrat'; text-align: center; margin: 20px 0; text-transform: uppercase; letter-spacing: 1px; font-size: 1.2rem; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; color: #888; margin-bottom: 6px; }
        input, select { width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #eee; font-size: 14px; outline: none; }
        
        .btn-action { width: 100%; background: var(--forest); color: white; padding: 16px; border-radius: 50px; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.3s; margin-top:10px;}
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        .event-card-item { display: flex; justify-content: space-between; align-items: center; background: #fcfcfc; padding: 15px; border-radius: 15px; margin-bottom: 12px; border: 1px solid #eee; }
        .ev-data b { display: block; color: var(--forest); font-size: 15px; }
        .ev-data span { display: block; color: #777; font-size: 11px; margin-top: 4px; }
        
        .btn-group { display: flex; gap: 10px; }
        .icon-btn { width: 35px; height: 35px; border-radius: 10px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .edit-btn { background: #e3f2fd; color: #1976d2; }
        .del-btn { background: #ffebee; color: #d32f2f; }

        .reg-table-container { margin-top: 50px; border-top: 4px solid var(--forest); padding-top: 30px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; min-width: 600px; }
        th { background: var(--forest); color: white; padding: 12px; text-align: left; text-transform: uppercase; font-size: 11px; }
        td { padding: 12px; border-bottom: 1px solid #eee; color: #444; }
        tr:hover { background: #f9fdfa; }

        .btn-cancel-return { display: inline-flex; align-items: center; gap: 8px; color: #888; text-decoration: none; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; transition: 0.3s; padding: 10px 20px; border-radius: 50px; }
        .btn-cancel-return:hover { color: var(--danger); background: rgba(211, 47, 47, 0.05); }
    </style>
</head>
<body>

<div id="authOverlay">
    <div class="auth-card">
        <div class="auth-header-row" style="display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #eee;">
            <img src="logo.png" style="height: 55px; width: auto;">
            <div style="text-align: left; line-height: 1.1;">
                <span style="font-family: 'Montserrat'; font-size: 22px; font-weight: 900; color: var(--forest); display: block; letter-spacing: 1px;">PARAMOUNT</span>
                <span style="font-size: 0.7rem; color: #b8860b; font-weight: 700; text-transform: uppercase; display: block;">English Medium School</span>
            </div>
        </div>
        <h2 style="margin-top: 0; font-size: 1.1rem; color: #444;">ADMIN ACCESS</h2>
        <input type="password" id="adminPassInput" class="auth-input" placeholder="Enter Private Password">
        <button class="btn-action" style="background:var(--gold); color:var(--forest);" onclick="authenticate()">UNLOCK PANEL</button>
        <div style="margin-top: 20px;"><a href="admin.html" class="btn-cancel-return"><i class="fas fa-times"></i> Cancel</a></div>
    </div>
</div>

<div class="admin-card" id="mainPanel" style="display:none;">
    <div class="top-bar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; background: #fafafa; padding: 15px 25px; border-radius: 20px; border: 1px solid #eee;">
        <div class="school-header-row" style="display: flex; align-items: center; gap: 15px;">
            <img src="logo.png" class="school-logo-img" style="height: 55px; width: auto;">
            <div class="school-text-box" style="display: flex; flex-direction: column; line-height: 1.1; text-align: left;">
                <span class="school-name-main" style="font-family: 'Montserrat'; font-size: 22px; font-weight: 900; color: var(--forest); letter-spacing: 1px;">PARAMOUNT</span>
                <span class="school-name-sub" style="font-size: 0.7rem; color: #b8860b; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Admin Control Panel</span>
            </div>
        </div>
        <a href="admin.html" class="btn-back-dash"><span>Dashboard</span><i class="fas fa-th-large"></i></a>
    </div>

    <h2 id="formHeader">Publish New Event</h2>
    <input type="hidden" id="editId">
    <div class="input-group"><label>Event Name</label><input type="text" id="evName"></div>
    <div class="input-group"><label>Description</label><input type="text" id="evDesc"></div>
    <div class="input-group"><label>Event Date</label><input type="datetime-local" id="evDate"></div>
    <div class="input-group"><label>Deadline</label><input type="datetime-local" id="regDeadline"></div>

    <button id="btnSave" class="btn-action" onclick="saveEvent()">PUBLISH EVENT</button>
    <button id="btnUpdate" class="btn-action" style="display:none; background:var(--info);" onclick="updateEvent()">SAVE CHANGES</button>
    <button id="btnCancel" class="btn-action" style="display:none; background:#888;" onclick="resetForm()">CANCEL EDIT</button>

    <div class="events-list" style="margin-top:40px;">
        <h3 style="font-size:14px; color:var(--forest); font-family: Montserrat;"><i class="fas fa-list"></i> LIVE EVENTS</h3>
        <div id="liveList"></div>
    </div>

    <div class="reg-table-container">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px;">
            <div>
                <h2 style="text-align: left; margin: 0;"><i class="fas fa-user-graduate"></i> Student Registrations</h2>
                <p style="font-size: 11px; color: #777; margin-top: 5px;">Manage and filter your participant list.</p>
            </div>
            <div id="countBadge" style="display: none; background: var(--forest); color: var(--gold); padding: 8px 15px; border-radius: 12px; font-weight: 800; font-size: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                TOTAL: <span id="regCount">0</span> PARTICIPANTS
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 15px; margin-top: 15px;">
            <div class="input-group" style="margin-bottom: 0;">
                <label>1. Select Event</label>
                <select id="regEventSelector" onchange="loadRegistrations()" style="padding: 12px; border-radius: 12px; border: 2px solid #eee;">
                    <option value="">-- Choose Event --</option>
                </select>
            </div>
            <div class="input-group" style="margin-bottom: 0;">
                <label>2. Filter Student List</label>
                <div style="position: relative;">
                    <input type="text" id="tableSearch" placeholder="Search by Name or Roll No..." onkeyup="filterTable()" style="padding: 12px 12px 12px 40px; border-radius: 12px; border: 2px solid var(--forest);">
                    <i class="fas fa-search" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--forest); opacity: 0.5;"></i>
                </div>
            </div>
        </div>
        
        <table id="regTable">
            <thead><tr><th>Roll No</th><th>Student Name</th><th>Class</th><th>Phone</th><th>Action</th></tr></thead>
            <tbody id="regBody"><tr><td colspan="5" style="text-align:center; padding:30px; color:#999;">Select an event above.</td></tr></tbody>
        </table>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDRYk9KOK-ga0c88dnYMsAoifW2NJTd_Y8", databaseURL: "https://paramount-school-d55bc-default-rtdb.firebaseio.com", projectId: "paramount-school-d55bc" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function authenticate() {
        if(document.getElementById('adminPassInput').value === "Ahmad@07") {
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('mainPanel').style.display = 'block';
        } else { Swal.fire('Error', 'Incorrect Password', 'error'); }
    }

    function saveEvent() {
        const name = document.getElementById('evName').value;
        const desc = document.getElementById('evDesc').value;
        const date = document.getElementById('evDate').value;
        const deadline = document.getElementById('regDeadline').value;

        if(!name || !date || !deadline) {
            return Swal.fire({
                title: 'Missing Info',
                text: 'Please fill in the Event Name, Date, and Deadline.',
                icon: 'warning',
                confirmButtonColor: '#004d26'
            });
        }

        Swal.fire({
            title: 'Publishing...',
            text: 'Uploading event to the student portal',
            allowOutsideClick: false,
            didOpen: () => { Swal.showLoading(); }
        });

        db.ref('school_events').push({ name, desc, date, regDeadline: deadline }).then(() => {
            Swal.fire({
                title: 'Event is Live!',
                html: `<b>${name}</b> has been published successfully.<br>Students will now see the registration popup.`,
                icon: 'success',
                confirmButtonColor: '#004d26',
                timer: 3000
            });
            resetForm();
        }).catch(err => Swal.fire('Error', err.message, 'error'));
    }

    db.ref('school_events').on('value', snap => {
        const listDiv = document.getElementById('liveList');
        const selector = document.getElementById('regEventSelector');
        listDiv.innerHTML = ''; selector.innerHTML = '<option value="">-- Choose Event --</option>';
        snap.forEach(child => {
            const ev = child.val();
            selector.innerHTML += `<option value="${ev.name}">${ev.name}</option>`;
            listDiv.innerHTML += `
                <div class="event-card-item">
                    <div class="ev-data"><b>${ev.name}</b><span>${ev.desc}</span></div>
                    <div class="btn-group">
                        <button class="icon-btn edit-btn" onclick="editMode('${child.key}', \`${ev.name}\`, \`${ev.desc}\`, '${ev.date}', '${ev.regDeadline}')"><i class="fas fa-pen"></i></button>
                        <button class="icon-btn del-btn" onclick="deleteEventWithBackup('${child.key}', \`${ev.name}\`)"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
        });
    });

    async function deleteEventWithBackup(id, eventName) {
        const result = await Swal.fire({
            title: 'Delete Event?',
            text: "A backup Excel will be downloaded before deletion.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d32f2f',
            confirmButtonText: 'Backup & Delete'
        });

        if (result.isConfirmed) {
            const regSnap = await db.ref(`event_registrations/${eventName}`).once('value');
            if (regSnap.exists()) {
                let csvContent = "data:text/csv;charset=utf-8,Roll No,Student Name,Class,Phone\n";
                Object.values(regSnap.val()).forEach(s => { csvContent += `${s.roll},${s.name},${s.cls},${s.phone}\n`; });
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Backup_${eventName}.csv`);
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            }
            await db.ref('school_events/' + id).remove();
            await db.ref(`event_registrations/${eventName}`).remove();
            Swal.fire('Deleted', 'Event removed successfully.', 'success');
        }
    }

    function editMode(id, name, desc, date, deadline) {
        document.getElementById('editId').value = id;
        document.getElementById('evName').value = name;
        document.getElementById('evDesc').value = desc;
        document.getElementById('evDate').value = date;
        document.getElementById('regDeadline').value = deadline;
        document.getElementById('formHeader').innerText = "Update Event Details";
        document.getElementById('btnSave').style.display = 'none';
        document.getElementById('btnUpdate').style.display = 'block';
        document.getElementById('btnCancel').style.display = 'block';
        window.scrollTo(0,0);
    }

    function updateEvent() {
        const id = document.getElementById('editId').value;
        const data = { name: document.getElementById('evName').value, desc: document.getElementById('evDesc').value, date: document.getElementById('evDate').value, regDeadline: document.getElementById('regDeadline').value };
        db.ref('school_events/' + id).update(data).then(() => { 
            Swal.fire('Updated', 'Event details saved.', 'success'); 
            resetForm(); 
        });
    }

    function resetForm() {
        document.getElementById('editId').value = '';
        document.getElementById('evName').value = ''; document.getElementById('evDesc').value = '';
        document.getElementById('evDate').value = ''; document.getElementById('regDeadline').value = '';
        document.getElementById('formHeader').innerText = "Publish New Event";
        document.getElementById('btnSave').style.display = 'block';
        document.getElementById('btnUpdate').style.display = 'none';
        document.getElementById('btnCancel').style.display = 'none';
    }

    function loadRegistrations() {
        const eventName = document.getElementById('regEventSelector').value;
        const body = document.getElementById('regBody');
        const countBadge = document.getElementById('countBadge');
        const regCount = document.getElementById('regCount');

        body.innerHTML = '<tr><td colspan="5" style="text-align:center;">Loading...</td></tr>';
        if(!eventName) { countBadge.style.display = 'none'; return; }

        db.ref(`event_registrations/${eventName}`).on('value', snap => {
            body.innerHTML = '';
            if(!snap.exists()) {
                body.innerHTML = '<tr><td colspan="5" style="text-align:center;">No students registered.</td></tr>';
                countBadge.style.display = 'none'; return;
            }
            const students = snap.val();
            const keys = Object.keys(students);
            countBadge.style.display = 'block';
            regCount.innerText = keys.length;

            keys.forEach(k => {
                const s = students[k];
                body.innerHTML += `<tr><td><b>${s.roll}</b></td><td>${s.name}</td><td>${s.cls}</td><td>${s.phone}</td>
                <td><button onclick="deleteStudent('${eventName}','${s.roll}')" style="color:red; border:none; background:none; cursor:pointer;"><i class="fas fa-trash"></i></button></td></tr>`;
            });
        });
    }

    function filterTable() {
        const filter = document.getElementById("tableSearch").value.toUpperCase();
        const tr = document.getElementById("regTable").getElementsByTagName("tr");
        for (let i = 1; i < tr.length; i++) {
            const tdR = tr[i].getElementsByTagName("td")[0];
            const tdN = tr[i].getElementsByTagName("td")[1];
            if (tdR || tdN) {
                const val = (tdR.textContent || tdR.innerText) + (tdN.textContent || tdN.innerText);
                tr[i].style.display = val.toUpperCase().indexOf(filter) > -1 ? "" : "none";
            }
        }
    }

    function deleteStudent(ev, roll) { db.ref(`event_registrations/${ev}/${roll}`).remove(); }
</script>
</body>
</html>
