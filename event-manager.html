<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Event Panel | Paramount School</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Segoe+UI:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        :root { --forest: #004d26; --gold: #ffd700; --light: #f4f7f6; --danger: #d32f2f; --info: #0288d1; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); margin: 0; min-height: 100vh; padding-bottom: 50px; }
        
        #authOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--forest); display:flex; align-items:center; justify-content:center; z-index:9999; padding: 20px; }
        .auth-card { background: white; width: 100%; max-width: 350px; padding: 40px 30px; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.3); text-align: center; }
        .auth-input { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #e0e0e0; background: #fafafa; font-size: 15px; outline: none; text-align: center; }
        
        .admin-card { max-width: 800px; margin: 40px auto; background: white; padding: 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); border-top: 8px solid var(--forest); }
        .school-header-row { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .school-logo-img { height: 50px; width: auto; }
        .school-text-box { display: flex; flex-direction: column; line-height: 1.1; }
        .school-name-main { font-family: 'Montserrat'; font-size: 1.1rem; font-weight: 800; color: var(--forest); letter-spacing: 0.5px; }
        .school-name-sub { font-size: 0.7rem; color: #b8860b; font-weight: 700; text-transform: uppercase; }

        h2 { color: var(--forest); font-family: 'Montserrat'; text-align: center; margin: 10px 0 25px; text-transform: uppercase; letter-spacing: 1px; font-size: 1.2rem; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; color: #888; margin-bottom: 6px; }
        input, select { width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #eee; font-size: 14px; outline: none; }
        
        .btn-action { width: 100%; background: var(--forest); color: white; padding: 16px; border-radius: 50px; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.3s; margin-top:10px;}
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        .reg-table-container { margin-top: 40px; border-top: 3px solid var(--gold); padding-top: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th { background: var(--forest); color: white; padding: 12px; text-align: left; text-transform: uppercase; font-size: 11px; }
        td { padding: 12px; border-bottom: 1px solid #eee; color: #444; }
        tr:hover { background: #f9f9f9; }

        .action-btns button { border: none; background: #f5f5f5; width: 35px; height: 35px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div id="authOverlay">
    <div class="auth-card">
        <img src="logo.png" style="height:70px; margin-bottom:15px;">
        <h2>ADMIN ACCESS</h2>
        <input type="password" id="adminPassInput" class="auth-input" placeholder="Enter Private Password">
        <button class="btn-action" style="background:var(--gold); color:var(--forest);" onclick="authenticate()">UNLOCK PANEL</button>
    </div>
</div>

<div class="admin-card" id="mainPanel" style="display:none;">
    <div class="school-header-row">
        <img src="logo.png" class="school-logo-img">
        <div class="school-text-box"><span class="school-name-main">PARAMOUNT</span><span class="school-name-sub">English Medium School</span></div>
    </div>

    <h2><i class="fas fa-edit"></i> Manage Events</h2>
    
    <div class="input-group">
        <label>Event Name</label>
        <input type="text" id="evName" placeholder="e.g. Science Fair">
    </div>
    <div class="input-group">
        <label>Event Description</label>
        <input type="text" id="evDesc" placeholder="e.g. Join the innovation hub">
    </div>
    <div class="input-group">
        <label>Event Date & Time (Actual Event Date)</label>
        <input type="datetime-local" id="evDate">
    </div>

    <div class="input-group">
        <label>Registration Deadline (Stop accepting forms after this)</label>
        <input type="datetime-local" id="regDeadline">
    </div>

    <button id="btnSave" class="btn-action" onclick="saveEvent()">PUBLISH EVENT</button>

    <div class="reg-table-container">
        <h3 style="color: var(--forest); font-family: Montserrat;"><i class="fas fa-users"></i> Student Registrations</h3>
        <div class="input-group">
            <label>Select Event to View List</label>
            <select id="regEventSelector" onchange="loadRegistrations()">
                <option value="">-- Select Event --</option>
            </select>
        </div>
        
        <table id="regTable">
            <thead>
                <tr>
                    <th>Roll No</th>
                    <th>Student Name</th>
                    <th>Class</th>
                    <th>Phone</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="regBody">
                <tr><td colspan="5" style="text-align:center; color:#999;">Select an event to load data</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDRYk9KOK-ga0c88dnYMsAoifW2NJTd_Y8", databaseURL: "https://paramount-school-d55bc-default-rtdb.firebaseio.com", projectId: "paramount-school-d55bc" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function authenticate() {
        if(document.getElementById('adminPassInput').value === "Ahmad@07") {
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('mainPanel').style.display = 'block';
        } else {
            Swal.fire('Error', 'Incorrect Password', 'error');
        }
    }

    function saveEvent() {
        const name = document.getElementById('evName').value;
        const desc = document.getElementById('evDesc').value;
        const date = document.getElementById('evDate').value;
        const deadline = document.getElementById('regDeadline').value; // Get deadline

        if(!name || !date || !deadline) return Swal.fire('Error', 'Name, Event Date, and Deadline are required', 'warning');

        db.ref('school_events').push({ 
            name: name, 
            desc: desc, 
            date: date, 
            regDeadline: deadline // Save deadline to Firebase
        }).then(() => {
            Swal.fire('Success', 'Event Published Successfully', 'success');
            setTimeout(() => location.reload(), 1500);
        });
    }

    db.ref('school_events').on('value', snap => {
        const selector = document.getElementById('regEventSelector');
        selector.innerHTML = '<option value="">-- Select Event --</option>';
        snap.forEach(child => {
            const ev = child.val();
            selector.innerHTML += `<option value="${ev.name}">${ev.name}</option>`;
        });
    });

    function loadRegistrations() {
        const eventName = document.getElementById('regEventSelector').value;
        const body = document.getElementById('regBody');
        body.innerHTML = '<tr><td colspan="5" style="text-align:center;">Loading registrations...</td></tr>';

        if(!eventName) return;

        db.ref(`event_registrations/${eventName}`).on('value', snap => {
            body.innerHTML = '';
            if(!snap.exists()) {
                body.innerHTML = '<tr><td colspan="5" style="text-align:center;">No students registered yet.</td></tr>';
                return;
            }
            snap.forEach(child => {
                const s = child.val();
                body.innerHTML += `
                    <tr>
                        <td><b>${s.roll}</b></td>
                        <td>${s.name}</td>
                        <td>${s.cls}</td>
                        <td>${s.phone}</td>
                        <td><button onclick="deleteReg('${eventName}', '${s.roll}')" style="color:red; border:none; background:none; cursor:pointer;"><i class="fas fa-trash"></i></button></td>
                    </tr>`;
            });
        });
    }

    function deleteReg(eventName, roll) {
        Swal.fire({
            title: 'Remove Student?',
            text: "This will delete their registration.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Delete'
        }).then((result) => {
            if (result.isConfirmed) {
                db.ref(`event_registrations/${eventName}/${roll}`).remove();
            }
        });
    }
</script>
</body>
</html>
