<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Attendance | Paramount</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Segoe+UI:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        :root { --forest: #004d26; --gold: #ffd700; --light: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        
        .card { 
            background: white; padding: 30px; border-radius: 35px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); width: 90%; 
            max-width: 400px; text-align: center; border-top: 10px solid var(--forest);
            margin: 20px;
        }

        .school-logo { height: 60px; margin-bottom: 15px; }
        h2 { font-family: 'Montserrat'; color: var(--forest); margin: 0; text-transform: uppercase; font-size: 22px; }
        p { font-size: 13px; color: #666; font-weight: 600; margin-bottom: 25px; }

        select { 
            width: 100%; padding: 16px; border-radius: 15px; 
            border: 2px solid #eee; font-size: 16px; font-weight: 600;
            margin-bottom: 20px; outline: none; appearance: none;
            background: #fafafa url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") no-repeat right 15px center;
            background-size: 15px;
        }

        .btn-confirm { 
            background: var(--forest); color: white; border: none; 
            padding: 18px; border-radius: 50px; font-weight: 800; 
            width: 100%; cursor: pointer; text-transform: uppercase; 
            font-family: 'Montserrat'; letter-spacing: 1px;
            transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-confirm:active { transform: scale(0.95); }

        .btn-history {
            background: none; border: 2px solid var(--forest); color: var(--forest); 
            padding: 12px; border-radius: 50px; font-weight: 700; 
            width: 100%; margin-top: 15px; cursor: pointer; 
            font-family: 'Montserrat'; font-size: 12px; transition: 0.3s;
        }
        .btn-history:hover { background: #e8f5e9; }

        .footer-note { font-size: 10px; color: #999; margin-top: 20px; text-transform: uppercase; font-weight: 700; }
    </style>
</head>
<body>

<div class="card">
    <img src="logo.png" class="school-logo" alt="Paramount Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2602/2602414.png'">
    <h2>Staff Check-In</h2>
    <p>Digital Attendance Diary</p>

    <select id="teacherName">
        <option value="" disabled selected>-- Select Your Name --</option>
        <option value="Shaik Tauseef Ali">Shaik Tauseef Ali</option>
        <option value="Teacher Name 2">Teacher Name 2</option>
        <option value="Teacher Name 3">Teacher Name 3</option>
        <option value="Office Admin">Office Admin</option>
    </select>

    <button class="btn-confirm" onclick="submitAttendance()">
        Confirm Arrival <i class="fas fa-signature"></i>
    </button>

    <button class="btn-history" onclick="showHistory()">
        <i class="fas fa-history"></i> View My Last 7 Days
    </button>

    <div class="footer-note">Secure GPS & Time Encrypted</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyDRYk9KOK-ga0c88dnYMsAoifW2NJTd_Y8", 
        databaseURL: "https://paramount-school-d55bc-default-rtdb.firebaseio.com", 
        projectId: "paramount-school-d55bc" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // FUNCTION TO GET UNIQUE TEACHER KEY
    function getTeacherKey(name) {
        return `history_${name.replace(/\s+/g, '_')}`;
    }

    async function submitAttendance() {
        const teacher = document.getElementById('teacherName').value;
        const urlParams = new URLSearchParams(window.location.search);
        const tokenInUrl = urlParams.get('auth');

        if(!teacher) return Swal.fire('Error', 'Please select your name.', 'warning');
        if(!tokenInUrl) return Swal.fire('Invalid Scan', 'Please scan the official QR code.', 'error');

        Swal.fire({ title: 'Verifying Presence...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

        navigator.geolocation.getCurrentPosition(async (position) => {
            const schoolLat = 17.3905498; 
            const schoolLng = 78.3708969; 
            const maxDistance = 0.2; 
            const userDist = calculateDistance(position.coords.latitude, position.coords.longitude, schoolLat, schoolLng);

            if (userDist > maxDistance) {
                Swal.close();
                return Swal.fire('Access Denied', 'You are too far from school.', 'error');
            }

            const now = new Date();
            const timeBlock = Math.floor(now.getTime() / 60000);
            const currentToken = btoa("PARAMOUNT_" + timeBlock);
            const prevToken = btoa("PARAMOUNT_" + (timeBlock - 1));

            if(tokenInUrl !== currentToken && tokenInUrl !== prevToken) {
                return Swal.fire('Expired QR', 'Scan the live screen in the office.', 'error');
            }

            const dateKey = now.toISOString().split('T')[0];
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            try {
                // 1. SAVE TO FIREBASE
                await db.ref(`teacher_attendance/${dateKey}/${teacher}`).set({
                    name: teacher, timeIn: timeString, status: "Present", date: dateKey, verification: "QR_AND_GPS_VERIFIED"
                });

                // 2. SAVE TO LOCAL HISTORY
                const historyEntry = { date: dateKey, time: timeString };
                const storageKey = getTeacherKey(teacher);
                
                let teacherHistory = JSON.parse(localStorage.getItem(storageKey) || "[]");
                teacherHistory.unshift(historyEntry); 
                teacherHistory = teacherHistory.slice(0, 7);
                localStorage.setItem(storageKey, JSON.stringify(teacherHistory));

                Swal.fire({
                    icon: 'success',
                    title: 'Attendance Marked!',
                    text: `Welcome, ${teacher}! Recorded at ${timeString}`,
                    confirmButtonColor: '#004d26'
                });

            } catch (e) {
                Swal.fire('Error', 'Database failed.', 'error');
            }
        }, (err) => {
            Swal.fire('GPS Required', 'Enable Location services.', 'error');
        }, { enableHighAccuracy: true });
    }

    function showHistory() {
        const teacher = document.getElementById('teacherName').value;
        if(!teacher) return Swal.fire('Select Name', 'Select your name first.', 'info');

        const storageKey = getTeacherKey(teacher);
        let teacherHistory = JSON.parse(localStorage.getItem(storageKey) || "[]");
        
        if (teacherHistory.length === 0) {
            return Swal.fire('No History', `No local records for ${teacher}.`, 'info');
        }

        let historyHtml = `<div style="text-align: left; min-width: 250px;">
                            <p style="margin-bottom:10px; color:#666;">Last 7 days for: <b>${teacher}</b></p>`;
        teacherHistory.forEach(entry => {
            historyHtml += `<div style="padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;">
                <strong>${entry.date}</strong> 
                <span style="color: #004d26; font-weight: 700; background: #e8f5e9; padding: 4px 8px; border-radius: 8px;">${entry.time}</span>
            </div>`;
        });
        historyHtml += '</div>';

        Swal.fire({ title: 'My Personal Logs', html: historyHtml, confirmButtonColor: '#004d26' });
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; 
        const dLat = (lat2-lat1) * Math.PI / 180;
        const dLon = (lon2-lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
</script>
</body>
</html>
