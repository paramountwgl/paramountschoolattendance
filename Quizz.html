<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramount Admin | Professional Assessment Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        :root {
            --forest: #064e3b; --gold: #d4af37; --white: #ffffff; --bg: #fdfdfb;
            --danger: #991b1b; --shadow: 0 10px 40px rgba(6, 78, 59, 0.12);
        }
        .btn-info { background: #0284c7; color: white; }
        .btn-reconduct { background: #10b981; color: white; }
        .btn i { margin-right: 5px; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); margin: 0; display: flex; min-height: 100vh; }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 280px; background: linear-gradient(180deg, var(--forest), #022c22);
            color: white; position: fixed; height: 100vh; border-right: 4px solid var(--gold); z-index: 1001;
        }
        .nav-item {
            display: flex; align-items: center; gap: 15px; padding: 18px 25px;
            color: white; text-decoration: none; transition: 0.3s; cursor: pointer;
        }
        .nav-item:hover, .nav-item.active { background: rgba(212, 175, 55, 0.2); color: var(--gold); border-left: 4px solid var(--gold); }

        /* --- CONTENT --- */
        .main-wrapper { margin-left: 280px; width: calc(100% - 280px); padding: 50px; box-sizing: border-box; }
        .content-section { display: none; animation: fadeIn 0.4s ease; }
        .content-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .premium-card { background: var(--white); border-radius: 24px; padding: 40px; box-shadow: var(--shadow); margin-bottom: 30px; border: 1px solid rgba(6, 78, 59, 0.05); }
        h2 { font-family: 'Playfair Display', serif; color: var(--forest); font-size: 2.2rem; margin-bottom: 30px; }

        /* --- FORM ELEMENTS --- */
        .grid-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        label { display: block; font-weight: 700; color: var(--forest); font-size: 0.85rem; margin-bottom: 8px; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 14px; border: 2px solid #eef2f7; border-radius: 12px; font-size: 1rem; box-sizing: border-box; }
        
        .btn { padding: 15px 30px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 10px; }
        .btn-gold { background: var(--gold); color: white; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4); }

        /* --- QUESTION BUILDER --- */
        .question-block { border-left: 6px solid var(--gold); position: relative; padding-top: 50px; margin-bottom: 25px; }
        .remove-q { position: absolute; top: 15px; right: 20px; color: var(--danger); cursor: pointer; font-weight: 700; font-size: 0.8rem; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .opt-item { display: flex; align-items: center; background: #f8fafc; padding: 10px; border-radius: 12px; border: 1.5px solid #f1f5f9; }
        .opt-item input[type="radio"] { width: auto; margin-right: 10px; accent-color: var(--gold); }

        /* --- RECENT QUIZZES TABLE --- */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; background: #f8f9fa; color: var(--forest); }
        td { padding: 15px; border-bottom: 1px solid #f1f1f1; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div style="padding: 40px 30px; text-align: center;">
            <img src="logo.png" alt="Paramount" style="width: 70px;">
            <h1 style="font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--gold); margin-top: 10px;">ADMIN PORTAL</h1>
        </div>
        <nav>
            <div class="nav-item active" onclick="showSection('dashboard')"><i class="fa-solid fa-layer-group"></i> Dashboard</div>
            <div class="nav-item" onclick="showSection('builder')"><i class="fa-solid fa-pen-fancy"></i> Create New Quiz</div>
            <div class="nav-item" onclick="showSection('stats')"><i class="fa-solid fa-chart-pie"></i> Student Results</div>
        </nav>
    </div>

    <div class="main-wrapper">
        
        <!-- DASHBOARD: RECENT QUIZZES -->
        <section id="dashboard" class="content-section active">
            <h2>Live Assessment Manager</h2>
            <div class="premium-card">
                <table id="quizTable">
                    <thead>
                        <tr>
                            <th>Quiz Title</th>
                            <th>Subject</th>
                            <th>Class</th>
                            <th>Duration</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="quizListBody"></tbody>
                </table>
            </div>
        </section>

        <!-- BUILDER: NEW ASSESSMENT -->
        <section id="builder" class="content-section">
            <h2>Assessment Designer</h2>
            
            <!-- Metadata -->
            <div class="premium-card">
                <div class="grid-row">
                    <div class="input-group">
                        <label>Assessment Subject</label>
                        <input type="text" id="quizSubject" placeholder="e.g. Mathematics">
                    </div>
                    <div class="input-group">
                        <label>Quiz Title (Visible to Students)</label>
                        <input type="text" id="quizTitle" placeholder="e.g. Mid-Term Excellence Test">
                    </div>
                </div>
                <div class="grid-row">
                    <div class="input-group">
                        <label>Target Class</label>
                        <select id="quizGrade">
                            <option value="Pre-KG">Pre-KG</option>
                            <option value="LKG">LKG</option>
                            <option value="UKG">UKG</option>
                            <option value="Grade 1">Grade 1</option>
                            <option value="Grade 2">Grade 2</option>
                            <option value="Grade 3">Grade 3</option>
                            <option value="Grade 4">Grade 4</option>
                            <option value="Grade 5">Grade 5</option>
                            <option value="Grade 6">Grade 6</option>
                            <option value="Grade 7">Grade 7</option>
                            <option value="Grade 8">Grade 8</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Time Limit (Minutes)</label>
                        <input type="number" id="quizDuration" placeholder="Enter minutes (e.g. 60 for 1 hour)">
                    </div>
                </div>
                <button class="btn btn-gold" onclick="publishQuiz()">PUBLISH TO PORTAL</button>
            </div>

            <!-- Question Area -->
            <div id="questionsContainer">
                <div class="premium-card question-block" data-q-id="1">
                    <label>QUESTION 1</label>
                    <textarea class="questionText" placeholder="Enter the assessment question..."></textarea>
                    <div class="options-grid">
                        <div class="opt-item"><input type="radio" name="c_1" value="0" checked><input type="text" class="opt" placeholder="Correct Choice"></div>
                        <div class="opt-item"><input type="radio" name="c_1" value="1"><input type="text" class="opt" placeholder="Option 2"></div>
                        <div class="opt-item"><input type="radio" name="c_1" value="2"><input type="text" class="opt" placeholder="Option 3"></div>
                        <div class="opt-item"><input type="radio" name="c_1" value="3"><input type="text" class="opt" placeholder="Option 4"></div>
                    </div>
                </div>
            </div>
            <button class="btn btn-outline" style="width: 100%; border: 2px dashed var(--forest);" onclick="addNewQuestion()">+ Add Next Question</button>
        </section>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRYk9KOK-ga0c88dnYMsAoifW2NJTd_Y8",
            authDomain: "paramount-school-d55bc.firebaseapp.com",
            projectId: "paramount-school-d55bc",
            storageBucket: "paramount-school-d55bc.firebasestorage.app",
            messagingSenderId: "130979432562",
            appId: "1:130979432562:web:4cd94787b23f9daba51aeb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- NAVIGATION ---
        window.showSection = (id) => {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        };
        window.reconductQuiz = async (quizId) => {
    if(confirm("Reconducting will signal a new session. Continue?")) {
        await setDoc(doc(db, "live_quizzes", quizId), { timestamp: new Date().toISOString() }, { merge: true });
        alert("Quiz session reset.");
    }
};

        // --- PUBLISH & LOCKING LOGIC ---
        window.publishQuiz = async function() {
            const subject = document.getElementById('quizSubject').value;
            const title = document.getElementById('quizTitle').value;
            const targetClass = document.getElementById('quizGrade').value;
            const duration = document.getElementById('quizDuration').value;

            if(!title || !targetClass || !duration) { alert("Missing metadata!"); return; }

            // Global Lock Check: Prevent multiple quizzes for the same class
            const existing = await getDocs(query(collection(db, "live_quizzes"), where("targetClass", "==", targetClass)));
            if (!existing.empty) {
                alert(`Error: ${targetClass} already has an active quiz.`);
                return;
            }

            const questions = [];
            document.querySelectorAll('.question-block').forEach((block) => {
                const qId = block.getAttribute('data-q-id');
                questions.push({
                    text: block.querySelector('.questionText').value,
                    options: Array.from(block.querySelectorAll('.opt')).map(i => i.value),
                    correctIndex: parseInt(block.querySelector(`input[name="c_${qId}"]:checked`).value)
                });
            });

            await setDoc(doc(db, "live_quizzes", targetClass), {
                title, subject, targetClass, duration, isLive: true, questions, timestamp: new Date().toISOString()
            });
            alert("Quiz Live!");
            showSection('dashboard');
        };

        // --- DASHBOARD LISTENER ---
       onSnapshot(collection(db, "live_quizzes"), (snapshot) => {
    const tbody = document.getElementById('quizListBody');
    tbody.innerHTML = ''; // Clears the table before reloading
    
    snapshot.forEach(docSnap => {
        const quiz = docSnap.data();
        const quizId = docSnap.id; // CRITICAL: This defines the ID so buttons work
        
        tbody.innerHTML += `
            <tr>
                <td><strong>${quiz.title}</strong></td>
                <td>${quiz.subject}</td>
                <td>${quiz.targetClass}</td>
                <td>${quiz.duration} Mins</td>
                <td style="display:flex; gap:10px; justify-content:center;">
                    <button class="btn btn-info" onclick='viewQuiz(${JSON.stringify(quiz)})'>
                        <i class="fa-solid fa-eye"></i> View
                    </button>
                    <button class="btn btn-reconduct" style="background:#10b981; color:white;" onclick="reconductQuiz('${quizId}')">
                        <i class="fa-solid fa-rotate-right"></i> Reconduct
                    </button>
                    <button class="btn btn-danger" onclick="deleteQuiz('${quizId}')">
                        <i class="fa-solid fa-trash"></i> Delete
                    </button>
                </td>
            </tr>`;
    });
});

       window.deleteQuiz = async (targetClass) => {
    if(confirm(`Are you sure? This will delete the ${targetClass} quiz AND all student records/times.`)) {
        try {
            // 1. Delete the main quiz document
            await deleteDoc(doc(db, "live_quizzes", targetClass));
            
            // 2. Clear local session for the teacher view
            alert("Quiz deleted. To fully clear student 'Start Times' for a new session, ensure you also clear the 'start_times' sub-collection in your Firebase Console.");
        } catch (e) {
            console.error("Error deleting quiz:", e);
        }
    }
};       
        
        window.viewQuiz = (quiz) => {
    // 1. Set the Modal Header to the Quiz Title
    document.getElementById('modalQuizTitle').innerText = quiz.title;

    // 2. Format the Date (Converts ISO string to readable text)
    const conductedDate = new Date(quiz.timestamp).toLocaleString();

    // 3. Build the Details Section with Forest Green styling
    let html = `
        <div style="background: #fdfaf0; padding: 20px; border-radius: 16px; border: 1px solid #d4af37; margin-bottom: 25px;">
            <h3 style="margin-top: 0; color: #064e3b; font-size: 1rem;">ASSESSMENT OVERVIEW</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.9rem; color: #4b5563;">
                <p><strong>Subject:</strong> ${quiz.subject}</p>
                <p><strong>Target Class:</strong> ${quiz.targetClass}</p>
                <p><strong>Time Limit:</strong> ${quiz.duration} Minutes</p>
                <p><strong>Date Conducted:</strong> ${conductedDate}</p>
            </div>
        </div>
        <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 20px 0;">
        <h3 style="color: #064e3b; font-size: 1rem;">QUESTIONS LIST</h3>
    `;

    // 4. Loop through the questions and options
    quiz.questions.forEach((q, i) => {
        html += `
            <div style="margin-bottom: 20px; padding: 15px; border-bottom: 1px solid #f1f1f1;">
                <p style="font-weight: 700; margin-bottom: 8px;">Q${i+1}: ${q.text}</p>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 0.85rem;">
                    ${q.options.map((opt, optIdx) => `
                        <div style="color: ${optIdx === q.correctIndex ? '#059669' : '#6b7280'}; font-weight: ${optIdx === q.correctIndex ? '700' : '400'}">
                            ${optIdx === q.correctIndex ? '✓' : '•'} ${opt}
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    });

    // 5. Inject the HTML into the modal and show it
    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('viewModal').style.display = 'block';
};

        window.addNewQuestion = function() {
            const id = Date.now();
            const html = `
                <div class="premium-card question-block" data-q-id="${id}">
                    <span class="remove-q" onclick="this.parentElement.remove()">REMOVE</span>
                    <label>QUESTION</label>
                    <textarea class="questionText" placeholder="Enter question..."></textarea>
                    <div class="options-grid">
                        <div class="opt-item"><input type="radio" name="c_${id}" value="0" checked><input type="text" class="opt" placeholder="Option 1"></div>
                        <div class="opt-item"><input type="radio" name="c_${id}" value="1"><input type="text" class="opt" placeholder="Option 2"></div>
                    </div>
                </div>`;
            document.getElementById('questionsContainer').insertAdjacentHTML('beforeend', html);
        };
    </script>
    <div id="viewModal" style="display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(5px);">
    <div style="background: white; margin: 5% auto; padding: 40px; border-radius: 24px; width: 60%; max-height: 80vh; overflow-y: auto;">
        <h2 id="modalQuizTitle" style="margin-top:0; color:#064e3b;">Quiz Details</h2>
        <div id="modalBody"></div>
        <button class="btn btn-gold" onclick="document.getElementById('viewModal').style.display='none'" style="margin-top:20px;">Close Preview</button>
    </div>
</div>
</body>
</html>
