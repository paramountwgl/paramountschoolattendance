<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramount | Elite Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --forest: #064e3b; --forest-light: #065f46; --gold: #d4af37;
            --gold-soft: #fdfaf0; --bg: #fdfdfb; --white: #ffffff;
            --danger: #991b1b; --shadow: 0 10px 40px rgba(6, 78, 59, 0.12);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg); margin: 0; display: flex; min-height: 100vh;
        }

        /* --- SIDEBAR NAVIGATION --- */
        .sidebar {
            width: 280px; background: linear-gradient(180deg, var(--forest), #022c22);
            color: white; display: flex; flex-direction: column; position: fixed; height: 100vh;
            border-right: 4px solid var(--gold); z-index: 1001;
        }

        .sidebar-header { padding: 30px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo-img { width: 60px; margin-bottom: 10px; }
        
        .nav-menu { flex: 1; padding: 20px; }
        .nav-item {
            display: flex; align-items: center; gap: 15px; padding: 15px;
            color: white; text-decoration: none; border-radius: 12px;
            margin-bottom: 10px; transition: 0.3s; cursor: pointer; border: 1px solid transparent;
        }
        .nav-item:hover, .nav-item.active { background: rgba(212, 175, 55, 0.2); border-color: var(--gold); color: var(--gold); }
        .logout-btn { margin: 20px; background: rgba(153, 27, 27, 0.2); border-color: var(--danger); }

        /* --- MAIN CONTENT AREA --- */
        .main-wrapper { margin-left: 280px; width: calc(100% - 280px); padding: 40px; box-sizing: border-box; }
        .content-section { display: none; animation: fadeIn 0.4s ease; }
        .content-section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- PREMIUM CARDS & TABLES --- */
        .premium-card { background: var(--white); border-radius: 24px; padding: 35px; box-shadow: var(--shadow); margin-bottom: 25px; border: 1px solid rgba(6, 78, 59, 0.05); }
        h2 { font-family: 'Playfair Display', serif; color: var(--forest); font-size: 2rem; margin-top: 0; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 15px; background: var(--gold-soft); color: var(--forest); font-weight: 700; border-radius: 8px 0 0 8px; }
        td { padding: 15px; border-bottom: 1px solid #eee; }
        .status-pill { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }
        .pill-live { background: #dcfce7; color: #166534; }

        /* --- REUSE BUILDER STYLES --- */
        .input-group { margin-bottom: 20px; }
        label { display: block; font-weight: 700; color: var(--forest); font-size: 0.85rem; margin-bottom: 8px; }
        input, select, textarea { width: 100%; padding: 14px; border: 2px solid #e5e7eb; border-radius: 12px; box-sizing: border-box; }
        .btn { padding: 12px 24px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-gold { background: var(--gold); color: white; }
        .btn-danger { background: #fee2e2; color: var(--danger); }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-header">
            <img src="logo.png" alt="Paramount" class="logo-img">
            <h1 style="font-family: 'Playfair Display', serif; font-size: 1.2rem; margin: 0; color: var(--gold);">PARAMOUNT ADMIN</h1>
        </div>
        <nav class="nav-menu">
            <div class="nav-item active" onclick="showSection('dashboard')"><i class="fa-solid fa-gauge"></i> Dashboard</div>
            <div class="nav-item" onclick="showSection('new-assessment')"><i class="fa-solid fa-plus-circle"></i> New Assessment</div>
            <div class="nav-item" onclick="showSection('results')"><i class="fa-solid fa-chart-line"></i> Monthly Results</div>
            <div class="nav-item logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Teacher Logout</div>
        </nav>
    </div>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
        
        <!-- SECTION: DASHBOARD (RECENT QUIZZES) -->
        <section id="dashboard" class="content-section active">
            <h2>Live Assessment Manager</h2>
            <div class="premium-card">
                <p style="color: #64748b;">Manage recent activity and monitor class occupancy.</p>
                <table id="recentQuizTable">
                    <thead>
                        <tr>
                            <th>Class</th>
                            <th>Subject</th>
                            <th>Scheduled Time</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="quizListBody">
                        <!-- Data injected by JS -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- SECTION: NEW ASSESSMENT (YOUR PREVIOUS BUILDER) -->
        <section id="new-assessment" class="content-section">
            <h2>Create Assessment</h2>
            <div class="premium-card">
                <div class="input-group">
                    <label>ASSESSMENT TITLE / SUBJECT</label>
                    <input type="text" id="quizTitle" placeholder="e.g. Mathematics Unit 1">
                </div>
                <div style="display: flex; gap: 20px;">
                    <div class="input-group" style="flex: 1;">
                        <label>CLASS</label>
                        <select id="quizGrade">
                            <option value="" disabled selected>Select Grade</option>
                            <option value="Grade 1">Grade 1</option>
                            <option value="Grade 5">Grade 5</option>
                        </select>
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <label>SCHEDULE TIME (24h)</label>
                        <input type="datetime-local" id="quizTime">
                    </div>
                </div>
                <button class="btn btn-gold" onclick="publishQuiz()"><i class="fa-solid fa-paper-plane"></i> Publish Live</button>
            </div>
            
            <div id="questionsContainer">
                <!-- Question logic remains same as your previous code -->
            </div>
        </section>

        <!-- SECTION: RESULTS -->
        <section id="results" class="content-section">
            <h2>Monthly Statistics</h2>
            <div class="premium-card">
                <label>Filter by Month</label>
                <input type="month" id="statMonth">
                <div id="statsGraph" style="margin-top: 30px; height: 200px; display: flex; align-items: flex-end; gap: 10px;">
                    <!-- Placeholder for bars -->
                </div>
            </div>
        </section>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRYk9KOK-ga0c88dnYMsAoifW2NJTd_Y8",
            authDomain: "paramount-school-d55bc.firebaseapp.com",
            projectId: "paramount-school-d55bc",
            storageBucket: "paramount-school-d55bc.firebasestorage.app",
            messagingSenderId: "130979432562",
            appId: "1:130979432562:web:4cd94787b23f9daba51aeb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- NAVIGATION LOGIC ---
        window.showSection = (id) => {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        };

        // --- SCHEDULING & CONFLICT LOGIC ---
        window.publishQuiz = async function() {
            const targetClass = document.getElementById('quizGrade').value;
            const title = document.getElementById('quizTitle').value;
            const scheduleTime = document.getElementById('quizTime').value;

            if (!targetClass || !scheduleTime) { alert("Please set Class and Time."); return; }

            // 1. Check for Global Conflict
            const q = query(collection(db, "live_quizzes"), where("targetClass", "==", targetClass));
            const existing = await getDocs(q);
            
            if (!existing.empty) {
                const currentQuiz = existing.docs[0].data();
                alert(`Conflict: ${targetClass} is already scheduled for ${currentQuiz.title}. Other teachers cannot book this class at this time.`);
                return;
            }

            // 2. Publish if No Conflict
            try {
                await setDoc(doc(db, "live_quizzes", targetClass), {
                    title, targetClass, scheduleTime, isLive: true, timestamp: new Date().toISOString()
                });
                alert(`Assessment Published. ${targetClass} is now locked for ${title}.`);
                showSection('dashboard');
            } catch (e) { console.error(e); }
        };

        // --- LIVE DASHBOARD LISTENER ---
        onSnapshot(collection(db, "live_quizzes"), (snapshot) => {
            const tbody = document.getElementById('quizListBody');
            tbody.innerHTML = '';
            snapshot.forEach(quizDoc => {
                const quiz = quizDoc.data();
                tbody.innerHTML += `
                    <tr>
                        <td>${quiz.targetClass}</td>
                        <td>${quiz.title}</td>
                        <td>${new Date(quiz.scheduleTime).toLocaleString()}</td>
                        <td><span class="status-pill pill-live">Occupied</span></td>
                        <td>
                            <button class="btn btn-gold" onclick="reconduct('${quiz.targetClass}')">Reconduct</button>
                            <button class="btn btn-danger" onclick="deleteQuiz('${quiz.targetClass}')">Delete</button>
                        </td>
                    </tr>
                `;
            });
        });

        window.deleteQuiz = async (id) => {
            if(confirm("Permanently delete this assessment and free the class?")) {
                await deleteDoc(doc(db, "live_quizzes", id));
            }
        };

        window.logout = () => {
            if(confirm("Log out of Teacher Portal?")) location.reload();
        };

    </script>
</body>
</html>
