<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramount | Quiz Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a237e; --accent: #00c853; --bg: #f4f7fe;
            --white: #ffffff; --text: #2c3e50; --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); margin: 0; display: flex; }
        .sidebar { width: 260px; background: var(--primary); height: 100vh; color: white; position: fixed; padding: 30px 20px; }
        .main-content { margin-left: 300px; padding: 40px; width: calc(100% - 340px); }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .premium-card { background: var(--white); border-radius: 16px; padding: 30px; box-shadow: var(--shadow); margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--primary); }
        input, select, textarea { width: 100%; padding: 12px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        .question-block { border-left: 5px solid var(--primary); position: relative; margin-bottom: 20px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .option-item { display: flex; align-items: center; background: #f9f9f9; padding: 10px; border-radius: 8px; }
        .btn { padding: 12px 25px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }

        #success-toast {
            visibility: hidden; min-width: 300px; background-color: var(--accent);
            color: #fff; text-align: center; border-radius: 12px; padding: 16px;
            position: fixed; z-index: 1000; right: 30px; top: 30px; font-weight: 600;
        }
        #success-toast.show { visibility: visible; animation: fadein 0.5s; }
        @keyframes fadein { from {top: 0; opacity: 0;} to {top: 30px; opacity: 1;} }
    </style>
</head>
<body>

    <div id="success-toast">The quiz is now live in the student portal! ✅</div>

    <div class="sidebar">
        <h2>PARAMOUNT</h2>
        <p style="opacity: 0.7;">Quiz Admin</p>
    </div>

    <div class="main-content">
        <div class="header-flex">
            <h1>Create Assessment</h1>
            <div style="display: flex; gap: 10px;">
                <!-- Using onclick again but pointing to window functions -->
                <button class="btn btn-outline" onclick="window.publishQuiz()">Publish Quiz</button>
                <button class="btn btn-primary" onclick="window.openCenter()">Open Control Center</button>
            </div>
        </div>

        <div class="premium-card">
            <div class="input-group">
                <label>Assessment Title</label>
                <input type="text" id="quizTitle" placeholder="e.g. Science Monthly Test">
            </div>
            <div style="display: flex; gap: 20px;">
                <div class="input-group" style="flex: 1;">
                    <label>Target Class</label>
                    <select id="quizGrade">
                        <option value="" disabled selected>Select Class</option>
                        <option value="LKG">LKG</option><option value="UKG">UKG</option>
                        <option value="Grade 1">Grade 1</option>
                        <option value="Grade 5">Grade 5</option>
                    </select>
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Passing %</label>
                    <input type="number" id="passPercent" value="40">
                </div>
            </div>
        </div>

        <div id="questionsContainer">
            <div class="premium-card question-block" data-q-id="1">
                <label>Question 1</label>
                <textarea class="questionText" placeholder="Enter question..."></textarea>
                <div class="options-grid">
                    <div class="option-item"><input type="radio" name="c_1" value="0" checked><input type="text" class="opt" placeholder="Option 1 (Correct)"></div>
                    <div class="option-item"><input type="radio" name="c_1" value="1"><input type="text" class="opt" placeholder="Option 2"></div>
                </div>
            </div>
        </div>
        <button class="btn btn-outline" onclick="window.addNewQuestion()" style="width: 100%;">+ Add New Question</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRYk9KOK-ga0c88dnYMsAoifW2NJTd_Y8",
            authDomain: "paramount-school-d55bc.firebaseapp.com",
            projectId: "paramount-school-d55bc",
            storageBucket: "paramount-school-d55bc.firebasestorage.app",
            messagingSenderId: "130979432562",
            appId: "1:130979432562:web:4cd94787b23f9daba51aeb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- ATTACH TO WINDOW SO HTML BUTTONS CAN SEE THEM ---
        
        window.publishQuiz = async function() {
            console.log("Publish button clicked...");
            const targetClass = document.getElementById('quizGrade').value;
            const title = document.getElementById('quizTitle').value;

            if (!title || !targetClass) {
                alert("Missing Title or Class!"); return;
            }

            const questions = [];
            document.querySelectorAll('.question-block').forEach((block) => {
                const opts = Array.from(block.querySelectorAll('.opt')).map(input => input.value);
                const qId = block.getAttribute('data-q-id');
                const correct = block.querySelector(`input[name="c_${qId}"]:checked`).value;
                questions.push({ text: block.querySelector('.questionText').value, options: opts, correctIndex: parseInt(correct) });
            });

            try {
                console.log("Attempting Firebase upload...");
                await setDoc(doc(db, "live_quizzes", targetClass), {
                    title, targetClass, isLive: true, activeQuestionIndex: 0, questions, timestamp: new Date().toISOString()
                });
                
                // Show Success Message
                const toast = document.getElementById("success-toast");
                toast.classList.add("show");
                setTimeout(() => toast.classList.remove("show"), 4000);
                
                console.log("Upload Success!");
            } catch (e) {
                console.error("Firebase Error:", e);
                alert("Upload failed. Check your browser console (F12) for errors.");
            }
        };

        window.openCenter = function() {
            const grade = document.getElementById('quizGrade').value;
            if(!grade) return alert("Select a class first.");
            window.location.href = "live-quizz-dashboard.html";
        };

        window.addNewQuestion = function() {
            const count = document.querySelectorAll('.question-block').length + 1;
            const html = `
                <div class="premium-card question-block" data-q-id="${count}">
                    <label>Question ${count}</label>
                    <textarea class="questionText" placeholder="Enter question..."></textarea>
                    <div class="options-grid">
                        <div class="option-item"><input type="radio" name="c_${count}" value="0" checked><input type="text" class="opt" placeholder="Option 1"></div>
                        <div class="option-item"><input type="radio" name="c_${count}" value="1"><input type="text" class="opt" placeholder="Option 2"></div>
                    </div>
                </div>`;
            document.getElementById('questionsContainer').insertAdjacentHTML('beforeend', html);
        };
    </script>
</body>
</html>
