    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Paramount Admin | Professional Assessment Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        :root {
    --forest: #064e3b;
    --forest-hover: #065f46;
    --gold: #d4af37;
    --gold-light: #f3e5ab;
    --white: #ffffff;
    --bg: #f8fafc;
    --danger: #be123c;
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
}
        .btn-info { background: #0284c7; color: white; }
        .btn-reconduct { background: #10b981; color: white; }
        .btn i { margin-right: 5px; }
        
body { 
    font-family: 'Plus Jakarta Sans', sans-serif; 
    background-color: var(--bg); 
    margin: 0; 
    display: flex; 
}

        /* --- SIDEBAR --- */
        .sidebar {
    width: 280px; 
    background: linear-gradient(180deg, var(--forest), #022c22);
    color: white; 
    position: fixed; 
    height: 100vh; 
    border-right: 1px solid rgba(255,255,255,0.1); 
    z-index: 1001;
}
        .nav-item {
    display: flex; 
    align-items: center; 
    gap: 15px; 
    padding: 16px 25px;
    margin: 8px 15px;
    border-radius: 12px;
    color: rgba(255,255,255,0.7); 
    text-decoration: none; 
    transition: 0.3s all ease; 
    cursor: pointer;
    font-weight: 500;
}
        .
.nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
.nav-item.active { 
    background: var(--gold); 
    color: var(--forest); 
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
    font-weight: 700;
}


        /* --- CONTENT --- */
        .main-wrapper { 
    margin-left: 280px; 
    width: calc(100% - 280px); 
    padding: 40px; 
    box-sizing: border-box; /* Critical: Includes padding in width calculation */
    overflow-x: hidden; /* Prevents horizontal leaking */
}
        .content-section { display: none; animation: fadeIn 0.4s ease; }
        .content-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

       .premium-card { 
    background: var(--white); 
    border-radius: 20px; 
    padding: 35px; 
    box-shadow: var(--shadow); 
    margin-bottom: 30px; 
    border: 1px solid #f1f5f9;
    width: 100%; /* Stays within main-wrapper bounds */
    box-sizing: border-box; 
}

        h2 { 
    font-family: 'Playfair Display', serif; 
    color: var(--forest); 
    font-size: 2.2rem; 
    margin-bottom: 30px; 
    letter-spacing: -0.02em;
}

  .grid-row { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 30px; 
    margin-bottom: 25px; 
    width: 100%;
    box-sizing: border-box;
}
        
        label { 
    display: block; 
    font-weight: 700; 
    color: var(--forest); 
    font-size: 0.75rem; 
    margin-bottom: 10px; 
    text-transform: uppercase; 
    letter-spacing: 0.05em;
}
        input, select, textarea {
    max-width: 100%;
    box-sizing: border-box;
}
        input:focus, select:focus { 
    outline: none; 
    border-color: var(--gold); 
    background-color: #fff;
}
        input, select {
    width: 100%;
    padding: 16px 20px;
    border: 1.5px solid #eef2f7;
    border-radius: 14px;
    background-color: #fcfdfe;
    transition: all 0.3s ease;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
}
      .input-group {
    display: flex;
    flex-direction: column;
    width: 100%; 
}

        
input:focus {
    border-color: var(--gold);
    box-shadow: 0 4px 12px rgba(212, 175, 55, 0.1);
    background-color: #ffffff;
}
        
      .btn { 
    padding: 16px 30px; 
    border-radius: 14px; 
    border: none; 
    font-weight: 700; 
    font-size: 0.95rem;
    cursor: pointer; 
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
    display: inline-flex; 
    align-items: center; 
    justify-content: center;
    gap: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
}
        .btn-gold { 
    background: linear-gradient(135deg, var(--gold), #b8860b); 
    color: white; 
    box-shadow: 0 10px 20px -5px rgba(212, 175, 55, 0.4); 
}
        .btn-gold:hover { 
    transform: translateY(-3px); 
    box-shadow: 0 15px 25px -5px rgba(212, 175, 55, 0.5); 
}
        .btn-outline {
    background: #ffffff;
    border: 2px dashed var(--forest);
    color: var(--forest);
    width: 100%;
    margin-top: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}
       .btn-outline:hover {
    background: rgba(6, 78, 59, 0.05);
    border-style: solid;
}
.btn-info, .btn-reconduct, .btn-danger {
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 0.8rem;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
        .toggle-btn {
    border: none;
    background: transparent;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.7rem;
    font-weight: 700;
    cursor: pointer;
    color: #64748b;
    transition: 0.3s;
    text-transform: uppercase;
}
        .toggle-btn.active-toggle {
    background: white;
    color: var(--forest);
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

        /* --- QUESTION BUILDER --- */
        .question-block { 
    border-left: 6px solid var(--gold); 
    padding: 35px; 
    background: #fafbfc;
    position: relative;
    animation: fadeIn 0.4s ease;
    margin-bottom: 30px;
    width: 100%;
    box-sizing: border-box; /* Prevents overflow */
    border-radius: 20px;
    box-shadow: var(--shadow);
}.remove-q { 
    /* Remove position: absolute if it was there */
    color: var(--danger); 
    cursor: pointer; 
    font-weight: 800; 
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(190, 18, 60, 0.05);
    transition: 0.3s;
}
        .remove-q:hover { 
    background: #fee2e2;
    color: #991b1b;
}
        .options-grid { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 20px; 
    margin-top: 20px; 
}
        .opt-item { 
    display: flex; 
    align-items: center; 
    background: white; 
    padding: 12px 18px; 
    border-radius: 12px; 
    border: 1.5px solid #f1f5f9; 
}
        .opt-item input[type="radio"] { width: auto; margin-right: 10px; accent-color: var(--gold); }

        /* --- RECENT QUIZZES TABLE --- */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; background: #f8f9fa; color: var(--forest); }
        td { padding: 15px; border-bottom: 1px solid #f1f1f1; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div style="padding: 40px 30px; text-align: center;">
            <img src="logo.png" alt="Paramount" style="width: 70px;">
            <h1 style="font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--gold); margin-top: 10px;">ADMIN PORTAL</h1>
        </div>
        <nav>
            <div class="nav-item active" onclick="showSection('dashboard')"><i class="fa-solid fa-layer-group"></i> Dashboard</div>
            <div class="nav-item" onclick="showSection('builder')"><i class="fa-solid fa-pen-fancy"></i> Create New Quiz</div>
            <div class="nav-item" onclick="showSection('stats')"><i class="fa-solid fa-chart-pie"></i> Student Results</div>
        </nav>
    </div>

    <div class="main-wrapper">
        
        <!-- SECTION 1: DASHBOARD -->
        <section id="dashboard" class="content-section active">
            <h2>Live Assessment Manager</h2>
            <div class="premium-card">
                <table id="quizTable">
                    <thead>
                        <tr>
                            <th>Quiz Title</th>
                            <th>Subject</th>
                            <th>Class</th>
                            <th style="text-align: center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="quizListBody"></tbody>
                </table>
            </div>
        </section>

        <!-- SECTION 2: CREATE NEW QUIZ (BUILDER) -->
        <section id="builder" class="content-section">
            <h2>Assessment Designer</h2>
            <div class="premium-card">
                <div class="grid-row">
                    <div class="input-group">
                        <label>Target Class</label>
                        <select id="quizGrade">
                            <option value="" disabled selected>Select Grade</option>
                            <option value="Pre-KG">Pre-KG</option>
                            <option value="LKG">LKG</option>
                            <option value="UKG">UKG</option>
                            <option value="Grade 1">Grade 1</option>
                            <option value="Grade 5">Grade 5</option>
                            <option value="Grade 8">Grade 8</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Assessment Subject</label>
                        <select id="quizSubject">
                            <option value="" disabled selected>Select Subject</option>
                            <option value="English">English</option>
                            <option value="Mathematics">Mathematics</option>
                            <option value="Science">Science</option>
                        </select>
                    </div>
                </div>
                <div class="input-wrapper-full">
                    <label>Quiz Title</label>
                    <input type="text" id="quizTitle" placeholder="e.g. Mid-Term Excellence">
                </div>
            </div>

            <div id="questionsContainer"></div>

            <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 80px;">
                <button class="btn btn-outline" onclick="addNewQuestion()">
                    <i class="fa-solid fa-plus"></i> ADD NEXT QUESTION
                </button>
                <div style="display: grid; grid-template-columns: 1fr 3fr; gap: 20px;">
                    <button class="btn" onclick="clearDesigner()" style="background: #f1f5f9; color: #475569;">
                        <i class="fa-solid fa-eraser"></i> RESET
                    </button>
                    <button class="btn btn-gold" onclick="publishQuiz()">
                        <i class="fa-solid fa-cloud-arrow-up"></i> FINAL PUBLISH
                    </button>
                </div>
            </div>
        </section>

        <!-- SECTION 3: STUDENT RESULTS (STATS) -->
        <section id="stats" class="content-section">
            <h2>Class Performance Analytics</h2>
            <div class="premium-card">
                <div class="grid-row">
                    <div class="input-group">
                        <label>Select Grade to Analyze</label>
                        <select id="statsGrade" onchange="loadClassResults()">
                            <option value="" disabled selected>Select Grade</option>
                            <option value="Pre-KG">Pre-KG</option>
                            <option value="LKG">LKG</option>
                            <option value="UKG">UKG</option>
                            <option value="Grade 1">Grade 1</option>
                            <option value="Grade 8">Grade 8</option>
                        </select>
                    </div>
                    <div id="classOverview" style="display:flex; flex-direction:column; justify-content:center;">
                        <p>Submissions: <span id="statCount">0</span></p>
                        <p>Class Average: <span id="statAvg">0%</span></p>
                    </div>
                </div>
                <div style="height: 300px; margin-top: 30px;">
                    <canvas id="performanceChart"></canvas>
                </div>
            </div>
            <div class="premium-card">
                <table>
                    <thead>
                        <tr>
                            <th>Roll No</th>
                            <th>Student Name</th>
                            <th>Score</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="statsTableBody"></tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- MODAL FOR VIEWING QUIZ -->
    <div id="viewModal" style="display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(5px);">
        <div style="background: white; margin: 5% auto; padding: 40px; border-radius: 24px; width: 60%; max-height: 80vh; overflow-y: auto;">
            <h2 id="modalQuizTitle" style="margin-top:0; color:#064e3b;">Quiz Details</h2>
            <div id="modalBody"></div>
            <button class="btn btn-gold" onclick="document.getElementById('viewModal').style.display='none'" style="margin-top:20px;">Close Preview</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRYk9KOK-ga0c88dnYMsAoifW2NJTd_Y8",
            authDomain: "paramount-school-d55bc.firebaseapp.com",
            projectId: "paramount-school-d55bc",
            storageBucket: "paramount-school-d55bc.firebasestorage.app",
            messagingSenderId: "130979432562",
            appId: "1:130979432562:web:4cd94787b23f9daba51aeb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let myChart = null;

        window.showSection = (id) => {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        };

        window.loadClassResults = async function() {
            const targetClass = document.getElementById('statsGrade').value;
            const tableBody = document.getElementById('statsTableBody');
            const responseRef = collection(db, `live_quizzes/${targetClass}/responses`);
            
            const querySnapshot = await getDocs(responseRef);
            const studentScores = {}; 
            
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const studentId = data.rollNo;
                if (!studentScores[studentId]) {
                    studentScores[studentId] = { name: data.studentName, correct: 0, total: 0, status: "Ongoing" };
                }
                if (data.qIdx !== undefined) {
                    studentScores[studentId].total++;
                    if (data.correct) studentScores[studentId].correct++;
                }
                if (data.status) studentScores[studentId].status = data.status;
            });

            tableBody.innerHTML = '';
            const labels = [], scores = [];
            let classTotalScore = 0, studentCount = 0;

            for (const roll in studentScores) {
                const student = studentScores[roll];
                const percentage = student.total > 0 ? Math.round((student.correct / student.total) * 100) : 0;
                labels.push(student.name);
                scores.push(percentage);
                classTotalScore += percentage;
                studentCount++;
                tableBody.innerHTML += `<tr><td>${roll}</td><td>${student.name}</td><td>${percentage}%</td><td>${student.status}</td></tr>`;
            }

            document.getElementById('statCount').innerText = studentCount;
            document.getElementById('statAvg').innerText = studentCount > 0 ? Math.round(classTotalScore / studentCount) + "%" : "0%";
            renderChart(labels, scores);
        };

        function renderChart(labels, data) {
            const ctx = document.getElementById('performanceChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{ label: 'Score %', data: data, backgroundColor: '#d4af37', borderRadius: 10 }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } }
            });
        }

        // --- Other Window Functions (Publish, Clear, AddQuestion etc) Go Here ---
        window.publishQuiz = async function() { /* ... your existing logic ... */ };
        window.clearDesigner = function() { /* ... your existing logic ... */ };
        window.addNewQuestion = function() { /* ... your existing logic ... */ };
        // Ensure you paste your full functions here from your previous code
    </script>

    <div id="viewModal" style="display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(5px);">
    <div style="background: white; margin: 5% auto; padding: 40px; border-radius: 24px; width: 60%; max-height: 80vh; overflow-y: auto;">
        <h2 id="modalQuizTitle" style="margin-top:0; color:#064e3b;">Quiz Details</h2>
        <div id="modalBody"></div>
        <button class="btn btn-gold" onclick="document.getElementById('viewModal').style.display='none'" style="margin-top:20px;">Close Preview</button>
    </div>
</div>
</body>
</html>
